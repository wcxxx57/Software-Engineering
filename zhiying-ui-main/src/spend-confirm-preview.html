<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SpendConfirm — 消耗确认弹窗组件预览 · AI编程学习助手</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link rel="stylesheet" href="variables.css" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  color: var(--text-primary);
  background-color: var(--bg-canvas);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(24px) scale(0.96); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes iconPop {
  0% { transform: scale(0) rotate(-20deg); }
  60% { transform: scale(1.2) rotate(5deg); }
  100% { transform: scale(1) rotate(0deg); }
}
@keyframes bounceNumber {
  0% { transform: scale(0.3); opacity: 0; }
  50% { transform: scale(1.15); }
  70% { transform: scale(0.95); }
  100% { transform: scale(1); opacity: 1; }
}
@keyframes pulse-glow {
  0%, 100% { box-shadow: 0 0 20px rgba(var(--yellow-rgb), 0.25); }
  50% { box-shadow: 0 0 40px rgba(var(--yellow-rgb), 0.5); }
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-6px); }
  40% { transform: translateX(6px); }
  60% { transform: translateX(-4px); }
  80% { transform: translateX(4px); }
}

/* ========== Modal Overlay ========== */
.spend-overlay {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: rgba(var(--surface-soft-rgb), 0.8);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  z-index: 9999;
  animation: fadeIn 0.4s ease;
}
.spend-card {
  position: relative;
  width: min(480px, calc(100vw - 48px));
  border-radius: 24px;
  background: rgba(var(--white-rgb), 0.85);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  box-shadow: var(--shadow-soft);
  overflow: hidden;
  animation: fadeInUp 0.5s cubic-bezier(0.16,1,0.3,1) 0.1s both;
}
.accent-bar {
  height: 4px;
  background: linear-gradient(90deg, var(--orange) 0%, var(--yellow) 50%, var(--blue-light) 100%);
}
.card-content {
  padding: 36px 36px 32px;
  display: flex; flex-direction: column; align-items: center; gap: 16px;
}
.close-btn {
  position: absolute; top: 20px; right: 20px;
  background: var(--bg-canvas);
  border: 1.5px solid rgba(var(--border-muted-rgb), 0.25);
  border-radius: 50%; width: 36px; height: 36px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 8px rgba(var(--border-muted-rgb), 0.15);
  transition: all 0.2s ease; z-index: 10;
}
.close-btn:hover {
  transform: rotate(90deg) scale(1.1);
  border-color: var(--orange-light);
  box-shadow: 0 4px 12px rgba(var(--orange-rgb), 0.25);
}

/* ========== Modal Icon ========== */
.modal-icon {
  width: 72px; height: 72px; border-radius: 22px;
  display: flex; align-items: center; justify-content: center;
  font-size: 36px;
  box-shadow: var(--shadow-soft);
  animation: iconPop 0.6s cubic-bezier(0.34,1.56,0.64,1) 0.2s both;
}
.modal-icon.gold { background: linear-gradient(135deg, var(--yellow-lighter), var(--yellow)); }
.modal-icon.diamond { background: linear-gradient(135deg, var(--blue-mist), var(--blue-lighter)); }
.modal-icon.warn { background: linear-gradient(135deg, var(--warn-bg), var(--peach-soft)); }
.modal-icon.exchange { background: linear-gradient(135deg, var(--purple-mist), var(--purple-lighter)); }

.modal-title {
  font-size: 22px; font-weight: 800; color: var(--brown-deep);
  text-align: center; letter-spacing: -0.3px;
}
.modal-subtitle {
  font-size: 14px; color: var(--brown-medium); text-align: center;
  font-weight: 500; line-height: 1.6; margin-top: -4px;
}

/* ========== Balance Bar ========== */
.balance-bar {
  display: flex; align-items: center; gap: 16px;
  padding: 10px 20px; border-radius: 14px;
  background: var(--bg-canvas);
  border: 1.5px solid rgba(var(--border-muted-rgb), 0.15);
  box-shadow: var(--shadow-inner);
  width: 100%;
  justify-content: center;
}
.balance-item {
  display: flex; align-items: center; gap: 6px;
  font-size: 14px; font-weight: 700; color: var(--brown-dark);
}
.balance-item .bal-icon { font-size: 18px; }
.balance-item .bal-num { font-variant-numeric: tabular-nums; }
.balance-divider {
  width: 1px; height: 20px;
  background: rgba(var(--border-muted-rgb), 0.25);
}

/* ========== Cost Chip (reward-chip style) ========== */
.cost-chip {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 16px 24px; border-radius: 18px;
  min-width: 110px; flex: 0 0 auto;
  transition: transform 0.2s ease;
}
.cost-chip:hover { transform: translateY(-2px); }
.cost-chip.gold-cost {
  background: linear-gradient(135deg, var(--yellow-mist) 0%, var(--yellow-lighter) 100%);
  border: 1.5px solid rgba(var(--yellow-rgb), 0.4);
  box-shadow: 0 4px 12px rgba(var(--yellow-rgb), 0.2);
}
.cost-chip.diamond-cost {
  background: linear-gradient(135deg, var(--blue-mist) 0%, var(--blue-lighter) 100%);
  border: 1.5px solid rgba(var(--blue-light-rgb), 0.3);
  box-shadow: 0 4px 12px rgba(var(--blue-light-rgb), 0.2);
}
.cost-chip.warn-cost {
  background: linear-gradient(135deg, var(--warn-bg) 0%, var(--rose-surface) 100%);
  border: 1.5px solid rgba(var(--danger-muted-rgb), 0.2);
  box-shadow: 0 4px 12px rgba(var(--danger-muted-rgb), 0.1);
}
.chip-icon { font-size: 28px; animation: bounceNumber 0.5s cubic-bezier(0.34,1.56,0.64,1) 0.4s both; }
.chip-amount {
  font-size: 26px; font-weight: 900; letter-spacing: -0.5px;
  animation: bounceNumber 0.5s cubic-bezier(0.34,1.56,0.64,1) 0.55s both;
}
.chip-amount.gold-num { color: var(--gold-rich); }
.chip-amount.diamond-num { color: var(--blue); }
.chip-amount.warn-num { color: var(--warn-text); }
.chip-label {
  font-size: 12px; font-weight: 700; color: var(--brown-medium);
  animation: bounceNumber 0.5s cubic-bezier(0.34,1.56,0.64,1) 0.65s both;
}

/* ========== After Balance ========== */
.after-balance {
  display: flex; align-items: center; gap: 8px;
  font-size: 13px; color: var(--brown-medium); font-weight: 600;
}
.after-balance .after-arrow { color: var(--orange); font-size: 16px; }
.after-balance .after-num { font-weight: 800; color: var(--brown-dark); }
.after-balance.negative .after-num { color: var(--warn-text); }

/* ========== Cost Grid (like rewards-grid) ========== */
.cost-grid {
  display: flex; flex-wrap: wrap; gap: 12px;
  justify-content: center; width: 100%; padding: 4px 0;
}

/* ========== Refund Hint ========== */
.refund-hint {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 16px; border-radius: 10px;
  background: var(--success-bg);
  font-size: 13px; font-weight: 600; color: var(--success-text);
}

/* ========== Buttons ========== */
.btn-row {
  display: flex; gap: 12px; width: 100%; margin-top: 4px;
}
.btn-confirm, .btn-cancel, .btn-action {
  flex: 1; height: 48px; border: none; border-radius: 9999px;
  font-family: inherit; font-size: 15px; font-weight: 700;
  cursor: pointer; transition: all 220ms ease;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.btn-confirm {
  background: linear-gradient(135deg, var(--yellow) 0%, var(--orange) 100%);
  color: var(--brown-dark);
  box-shadow: 0 4px 16px rgba(var(--orange-rgb), 0.35);
}
.btn-confirm:hover {
  background: linear-gradient(135deg, var(--orange-light) 0%, var(--orange) 100%);
  box-shadow: 0 6px 24px rgba(var(--orange-rgb), 0.45);
  transform: translateY(-1px);
}
.btn-confirm:active { transform: translateY(0); }
.btn-cancel {
  background: var(--bg-canvas);
  color: var(--brown-medium);
  border: 2px solid rgba(var(--border-muted-rgb), 0.25);
}
.btn-cancel:hover {
  border-color: rgba(var(--border-muted-rgb), 0.4);
  background: var(--white);
}
.btn-action-diamond {
  flex: 1; height: 48px; border: none; border-radius: 9999px;
  font-family: inherit; font-size: 15px; font-weight: 700;
  cursor: pointer; transition: all 220ms ease;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  background: linear-gradient(135deg, var(--blue-mist) 0%, var(--blue-lighter) 100%);
  color: var(--blue-strong);
  box-shadow: 0 4px 16px rgba(var(--blue-light-rgb), 0.25);
}
.btn-action-diamond:hover {
  box-shadow: 0 6px 24px rgba(var(--blue-light-rgb), 0.35);
  transform: translateY(-1px);
}
.btn-action-gold {
  flex: 1; height: 48px; border: none; border-radius: 9999px;
  font-family: inherit; font-size: 15px; font-weight: 700;
  cursor: pointer; transition: all 220ms ease;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  background: linear-gradient(135deg, var(--yellow-lighter) 0%, var(--yellow) 100%);
  color: var(--brown-dark);
  box-shadow: 0 4px 16px rgba(var(--yellow-rgb), 0.35);
}
.btn-action-gold:hover {
  box-shadow: 0 6px 24px rgba(var(--yellow-rgb), 0.45);
  transform: translateY(-1px);
}

/* ========== Warn Shake ========== */
.shake-anim { animation: shake 0.5s ease 0.3s; }

/* ========== Insufficient Alert ========== */
.insufficient-alert {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 16px; border-radius: 12px;
  background: var(--warn-bg);
  font-size: 13px; font-weight: 700; color: var(--warn-text);
  width: 100%;
}

/* ========== Exchange Widget ========== */
.exchange-row {
  display: flex; align-items: center; gap: 12px;
  padding: 16px; border-radius: 16px;
  background: var(--bg-canvas);
  border: 1.5px solid rgba(var(--border-muted-rgb), 0.15);
  width: 100%;
}
.exchange-side {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
}
.exchange-side .ex-icon { font-size: 28px; }
.exchange-side .ex-num { font-size: 22px; font-weight: 900; }
.exchange-side .ex-label { font-size: 11px; font-weight: 600; color: var(--brown-medium); }
.exchange-arrow { font-size: 24px; color: var(--orange); flex-shrink: 0; }
.exchange-qty {
  display: flex; align-items: center; gap: 10px; margin-top: 4px;
}
.qty-btn {
  width: 36px; height: 36px; border-radius: 50%;
  border: 2px solid rgba(var(--border-muted-rgb), 0.25);
  background: var(--bg-canvas);
  font-size: 18px; font-weight: 800; color: var(--brown-dark);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all 0.2s ease;
}
.qty-btn:hover { border-color: var(--orange); background: var(--orange-mist); }
.qty-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.qty-display {
  font-size: 28px; font-weight: 900; color: var(--brown-deep);
  min-width: 40px; text-align: center;
}
.exchange-remaining {
  font-size: 12px; color: var(--brown-medium); font-weight: 600;
}

/* ========== Demo Controls ========== */
.demo-controls {
  max-width: 740px; margin: 40px auto; padding: 0 24px;
  display: flex; flex-direction: column; gap: 32px;
}
.demo-section-title {
  font-size: 20px; font-weight: 800; color: var(--brown-dark);
  display: flex; align-items: center; gap: 8px;
  padding-bottom: 12px; border-bottom: 2px solid rgba(var(--border-muted-rgb), 0.15);
}
.demo-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 12px;
}
.demo-btn {
  padding: 14px 20px; border-radius: 16px;
  border: 2px solid transparent;
  font-family: inherit; font-size: 14px; font-weight: 700;
  cursor: pointer; transition: all 0.25s ease;
  display: flex; align-items: center; gap: 10px;
  box-shadow: var(--shadow-soft);
}
.demo-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
.demo-btn:active { transform: translateY(0); }
.demo-btn.gold-btn {
  background: linear-gradient(135deg, var(--yellow-mist), var(--yellow-lighter));
  color: var(--brown-dark); border-color: rgba(var(--yellow-rgb), 0.3);
}
.demo-btn.diamond-btn {
  background: linear-gradient(135deg, var(--blue-mist), var(--blue-lighter));
  color: var(--brown-dark); border-color: rgba(var(--blue-light-rgb), 0.3);
}
.demo-btn.warn-btn {
  background: linear-gradient(135deg, var(--rose-surface), var(--warn-bg));
  color: var(--brown-dark); border-color: rgba(var(--danger-muted-rgb), 0.15);
}
.demo-btn.purple-btn {
  background: linear-gradient(135deg, var(--purple-mist), var(--purple-lighter));
  color: var(--brown-dark); border-color: rgba(var(--purple-rgb), 0.3);
}
.demo-btn.mixed-btn {
  background: linear-gradient(135deg, var(--orange-mist), var(--orange-lighter));
  color: var(--brown-dark); border-color: rgba(var(--orange-rgb), 0.3);
}
.demo-btn-icon {
  width: 32px; height: 32px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; background: rgba(var(--white-rgb), 0.6); flex-shrink: 0;
}
.page-header { text-align: center; padding: 48px 24px 0; }
.page-header h1 {
  font-size: 32px; font-weight: 900;
  background: linear-gradient(135deg, var(--brown-dark) 0%, var(--accent-warm) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  margin-bottom: 8px;
}
.page-header p { font-size: 15px; color: var(--brown-medium); font-weight: 500; }
</style>
</head>

    subtitle: '「极简银光」白银头像框 · 限时 30 天',
    costType: 'gold', costAmount: 300, costLabel: '金币租赁',
    confirmText: '🪙 确认租赁', cancelText: '取消'
  },
  'skin-epic-gold': {
    icon: '👑', iconClass: 'gold',
    title: '购买史诗头像框？',
    subtitle: '「赛博霓虹」史诗头像框 · 永久买断<br>也可用 50 钻石购买',
    costType: 'gold', costAmount: 1500, costLabel: '金币购买',
    confirmText: '🪙 金币购买', cancelText: '取消',
    altDiamondCost: 50
  },
  'no-diamond': {
    type: 'insufficient', currencyType: 'diamond',
    icon: '💎', iconClass: 'warn',
    title: '钻石不足',
    subtitle: '当前钻石余额不足以完成本次操作',
    needed: 80, have: 35
  },
  'no-gold': {
    type: 'insufficient', currencyType: 'gold',
    icon: '🪙', iconClass: 'warn',
    title: '金币不足',
    subtitle: '当前金币余额不足以完成本次操作',
    needed: 1500, have: 320
  },
  'exchange': {
    type: 'exchange',
    icon: '🔄', iconClass: 'exchange',
    title: '疯狂星期六 · 金币兑换钻石',
    subtitle: '每周六限定，30 金币兑换 1 钻石'
  }
};

// ========== Render helpers ==========
function balanceBarHTML() {
  return '<div class="balance-bar">'
    + '<div class="balance-item"><span class="bal-icon">🪙</span><span class="bal-num">' + userBalance.gold + '</span></div>'
    + '<div class="balance-divider"></div>'
    + '<div class="balance-item"><span class="bal-icon">💎</span><span class="bal-num">' + userBalance.diamond + '</span></div>'
    + '</div>';
}

function costChipHTML(type, amount, label) {
  var cls = type === 'diamond' ? 'diamond-cost' : type === 'warn' ? 'warn-cost' : 'gold-cost';
  var numCls = type === 'diamond' ? 'diamond-num' : type === 'warn' ? 'warn-num' : 'gold-num';
  var icon = type === 'diamond' ? '💎' : '🪙';
  return '<div class="cost-chip ' + cls + '">'
    + '<span class="chip-icon">' + icon + '</span>'
    + '<span class="chip-amount ' + numCls + '">-' + amount + '</span>'
    + '<span class="chip-label">' + label + '</span>'
    + '</div>';
}

function afterBalanceHTML(type, amount) {
  var current = type === 'diamond' ? userBalance.diamond : userBalance.gold;
  var after = current - amount;
  var icon = type === 'diamond' ? '💎' : '🪙';
  var neg = after < 0 ? ' negative' : '';
  return '<div class="after-balance' + neg + '">'
    + '<span>操作后余额</span>'
    + '<span class="after-arrow">➜</span>'
    + '<span>' + icon + '</span>'
    + '<span class="after-num">' + after + '</span>'
    + '</div>';
}

// ========== Render: normal spend confirm ==========
function renderSpendConfirm(s) {
  var h = '';
  h += '<div class="modal-icon ' + s.iconClass + '">' + s.icon + '</div>';
  h += '<div class="modal-title">' + s.title + '</div>';
  h += '<div class="modal-subtitle">' + s.subtitle + '</div>';
  h += balanceBarHTML();

  // Cost chips (reward-chip style)
  h += '<div class="cost-grid">';
  h += costChipHTML(s.costType, s.costAmount, s.costLabel);
  if (s.altDiamondCost) {
    h += costChipHTML('diamond', s.altDiamondCost, '或钻石购买');
  }
  h += '</div>';

  if (s.altDiamondCost) {
    // Show after-balance for both payment methods
    var goldAfter = userBalance.gold - s.costAmount;
    var diamondAfter = userBalance.diamond - s.altDiamondCost;
    var goldNeg = goldAfter < 0 ? ' negative' : '';
    var diamondNeg = diamondAfter < 0 ? ' negative' : '';
    h += '<div style="display:flex; gap:24px; align-items:center; flex-wrap:wrap; justify-content:center;">';
    h += '<div class="after-balance' + goldNeg + '">'
      + '<span>金币购买后</span>'
      + '<span class="after-arrow">➜</span>'
      + '<span>🪙</span>'
      + '<span class="after-num">' + goldAfter + '</span>'
      + '</div>';
    h += '<div class="after-balance' + diamondNeg + '">'
      + '<span>钻石购买后</span>'
      + '<span class="after-arrow">➜</span>'
      + '<span>💎</span>'
      + '<span class="after-num">' + diamondAfter + '</span>'
      + '</div>';
    h += '</div>';
  } else {
    h += afterBalanceHTML(s.costType, s.costAmount);
  }

  if (s.refundHint) {
    h += '<div class="refund-hint">' + s.refundHint + '</div>';
  }

  // Buttons
  if (s.altDiamondCost) {
    h += '<div class="btn-row">';
    h += '<button class="btn-cancel" onclick="closeModal()">' + s.cancelText + '</button>';
    h += '<button class="btn-action-gold" onclick="closeModal()">' + s.confirmText + '</button>';
    h += '<button class="btn-action-diamond" onclick="closeModal()">💎 钻石购买</button>';
    h += '</div>';
  } else {
    h += '<div class="btn-row">';
    h += '<button class="btn-cancel" onclick="closeModal()">' + s.cancelText + '</button>';
    h += '<button class="btn-confirm" onclick="closeModal()">' + s.confirmText + '</button>';
    h += '</div>';
  }
  return h;
}

// ========== Render: insufficient balance ==========
function renderInsufficient(s) {
  var h = '';
  h += '<div class="modal-icon ' + s.iconClass + ' shake-anim">' + s.icon + '</div>';
  h += '<div class="modal-title">' + s.title + '</div>';
  h += '<div class="modal-subtitle">' + s.subtitle + '</div>';

  var icon = s.currencyType === 'diamond' ? '💎' : '🪙';
  h += '<div class="cost-grid">';
  h += '<div class="cost-chip warn-cost">';
  h += '<span class="chip-icon">' + icon + '</span>';
  h += '<span class="chip-amount warn-num">需要 ' + s.needed + '</span>';
  h += '<span class="chip-label">当前持有 ' + s.have + '</span>';
  h += '</div>';
  h += '</div>';

  h += '<div class="insufficient-alert">⚠️ 还差 <strong>' + (s.needed - s.have) + '</strong> ' + (s.currencyType === 'diamond' ? '钻石' : '金币') + '才能完成操作</div>';

  h += '<div class="btn-row">';
  h += '<button class="btn-cancel" onclick="closeModal()">返回</button>';
  if (s.currencyType === 'diamond') {
    h += '<button class="btn-action-diamond" onclick="closeModal()">💎 去充值</button>';
  } else {
    h += '<button class="btn-confirm" onclick="closeModal()">📅 去签到赚金币</button>';
  }
  h += '</div>';
  return h;
}

// ========== Render: exchange ==========
function renderExchange(s) {
  exchangeQty = 1;
  var remaining = exchangeMax - exchangeUsed;
  var h = '';
  h += '<div class="modal-icon ' + s.iconClass + '">' + s.icon + '</div>';
  h += '<div class="modal-title">' + s.title + '</div>';
  h += '<div class="modal-subtitle">' + s.subtitle + '</div>';
  h += balanceBarHTML();

  h += '<div class="exchange-row">';
  h += '<div class="exchange-side"><span class="ex-icon">🪙</span><span class="ex-num" id="exGoldNum" style="color:var(--gold-rich)">-30</span><span class="ex-label">消耗金币</span></div>';
  h += '<span class="exchange-arrow">➜</span>';
  h += '<div class="exchange-side"><span class="ex-icon">💎</span><span class="ex-num" id="exDiamondNum" style="color:var(--blue)">+1</span><span class="ex-label">获得钻石</span></div>';
  h += '</div>';

  h += '<div class="exchange-qty">';
  h += '<button class="qty-btn" id="qtyMinus" onclick="changeQty(-1)">−</button>';
  h += '<span class="qty-display" id="qtyDisplay">1</span>';
  h += '<button class="qty-btn" id="qtyPlus" onclick="changeQty(1)">+</button>';
  h += '</div>';
  h += '<div class="exchange-remaining">本周剩余额度：<strong id="exRemaining">' + remaining + '</strong> / ' + exchangeMax + '</div>';

  h += '<div class="btn-row">';
  h += '<button class="btn-cancel" onclick="closeModal()">取消</button>';
  h += '<button class="btn-confirm" onclick="closeModal()" id="exConfirmBtn">🔄 确认兑换</button>';
  h += '</div>';
  return h;
}

function changeQty(delta) {
  var remaining = exchangeMax - exchangeUsed;
  var maxAffordable = Math.floor(userBalance.gold / 30);
  var maxQty = Math.min(remaining, maxAffordable);
  exchangeQty = Math.max(1, Math.min(maxQty, exchangeQty + delta));

  document.getElementById('qtyDisplay').textContent = exchangeQty;
  document.getElementById('exGoldNum').textContent = '-' + (exchangeQty * 30);
  document.getElementById('exDiamondNum').textContent = '+' + exchangeQty;
  document.getElementById('qtyMinus').disabled = exchangeQty <= 1;
  document.getElementById('qtyPlus').disabled = exchangeQty >= maxQty;
}

// ========== Show / Close ==========
function showModal(key) {
  var s = scenarios[key];
  if (!s) return;

  var content = document.getElementById('modalContent');
  if (s.type === 'insufficient') {
    content.innerHTML = renderInsufficient(s);
  } else if (s.type === 'exchange') {
    content.innerHTML = renderExchange(s);
    changeQty(0); // init button states
  } else {
    content.innerHTML = renderSpendConfirm(s);
  }

  var overlay = document.getElementById('spendOverlay');
  overlay.style.display = 'flex';
  var card = document.getElementById('spendCard');
  card.style.animation = 'none';
  card.offsetHeight;
  card.style.animation = 'fadeInUp 0.5s cubic-bezier(0.16,1,0.3,1) 0.1s both';
}

function closeModal() {
  document.getElementById('spendOverlay').style.display = 'none';
}

document.getElementById('spendOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});
</script>
</body>
</html>
