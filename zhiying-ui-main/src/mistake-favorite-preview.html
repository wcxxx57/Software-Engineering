<style>
*{box-sizing:border-box;margin:0;padding:0}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border-muted);border-radius:4px}::-webkit-scrollbar-thumb:hover{background:var(--border-strong)}
body{font-family:"Inter",system-ui,"PingFang SC",sans-serif;color:var(--text-primary);background-color:var(--bg-canvas)}

.immersive-layout{min-height:100vh;display:flex;justify-content:center;overflow-y:auto;background-color:var(--bg-canvas)}
.immersive-container{width:100%;max-width:1200px;padding:40px 32px 80px;display:flex;flex-direction:column}

.header-actions{display:flex;align-items:center;margin-bottom:24px}
.btn-back{display:inline-flex;align-items:center;gap:6px;background:rgba(var(--white-rgb), 0.6);backdrop-filter:blur(8px);color:var(--brown-dark);text-decoration:none;font-size:14px;font-weight:700;padding:8px 16px;border-radius:999px;transition:all .2s ease;border:1px solid rgba(var(--white-rgb), 0.8);box-shadow:0 4px 12px rgba(var(--border-muted-rgb), 0.4);cursor:pointer}
.btn-back:hover{background:rgba(var(--white-rgb), 0.9);color:var(--brown-medium);transform:translateY(-1px);box-shadow:0 6px 16px rgba(var(--border-muted-rgb), 0.5)}

.page-header{margin-bottom:40px}
.page-title{font-size:56px;font-weight:800;margin-bottom:12px;background:linear-gradient(135deg,var(--brown-dark) 0%,var(--orange) 60%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;display:flex;align-items:center;letter-spacing:-1px}
.typewriter-cursor{color:var(--orange);animation:blink 1s step-end infinite;margin-left:4px;font-weight:400;-webkit-text-fill-color:var(--orange);text-shadow:0 0 10px rgba(var(--orange-rgb), 0.5)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.page-subtitle{font-size:28px;font-weight:500;color:var(--brown-medium)}

/* Tab 切换 */
.tab-container{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:9999px;background:var(--bg-canvas);box-shadow:var(--shadow-inner);max-width:360px;margin-bottom:40px}
.tab-slider{position:absolute;top:4px;width:calc(50% - 6px);height:calc(100% - 8px);border-radius:9999px;background:linear-gradient(135deg,var(--yellow),var(--yellow-light));box-shadow:0 2px 8px rgba(var(--yellow-rgb), 0.35);transition:left 250ms cubic-bezier(0.4,0,0.2,1)}
.tab-slider[data-mode="mistakes"]{left:4px}
.tab-slider[data-mode="favorites"]{left:calc(50% + 2px)}
.tab-btn{position:relative;z-index:1;height:46px;border-radius:9999px;border:none;background:transparent;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;transition:color 250ms ease;display:flex;align-items:center;justify-content:center;gap:6px}
.tab-btn[data-active="true"]{color:var(--brown-dark)}
.tab-btn[data-active="false"]{color:var(--brown-medium)}
.tab-btn:hover[data-active="false"]{color:var(--brown-dark)}

/* 搜索栏 */
.search-container{position:relative;width:100%;margin-bottom:40px;transition:all .3s cubic-bezier(.25,1,.5,1);z-index:50}
.search-container:hover{transform:translateY(-2px)}
.search-container::before{content:"";position:absolute;inset:-2px;background:linear-gradient(135deg,var(--yellow),var(--orange-light),var(--orange));border-radius:30px;opacity:.6;transition:opacity .3s ease;z-index:-1;filter:blur(2px)}
.search-container:focus-within::before{opacity:1;filter:blur(4px)}
.input-search{width:100%;height:56px;border-radius:28px;border:2px solid transparent;background:linear-gradient(rgba(var(--surface-soft-rgb), 0.95),rgba(var(--surface-soft-rgb), 0.95)) padding-box,linear-gradient(135deg,var(--yellow-light),var(--orange-light)) border-box;backdrop-filter:blur(10px);box-shadow:inset 2px 2px 6px rgba(var(--border-muted-rgb), 0.1),inset -2px -2px 6px rgba(var(--white-rgb), 0.8),0 4px 12px rgba(var(--border-muted-rgb), 0.15);padding:0 24px 0 56px;font-size:16px;color:var(--text-primary);outline:none;transition:all .3s cubic-bezier(.25,1,.5,1)}
.input-search::placeholder{color:var(--brown-light);font-weight:500}
.input-search:focus{background:linear-gradient(var(--white),var(--white)) padding-box,linear-gradient(135deg,var(--yellow),var(--orange)) border-box;box-shadow:inset 2px 2px 4px rgba(var(--border-muted-rgb), 0.05),inset -2px -2px 4px rgba(var(--white-rgb), 0.9),0 8px 24px rgba(var(--yellow-rgb), 0.3);transform:scale(1.02)}
.search-icon{position:absolute;left:20px;top:50%;transform:translateY(-50%);color:var(--brown-light);transition:color .3s ease;pointer-events:none;z-index:1}
.search-container:focus-within .search-icon{color:var(--orange)}

.search-suggestions{position:absolute;top:calc(100% + 12px);left:0;width:100%;border-radius:16px;background:rgba(var(--white-rgb), 0.95);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 8px 32px rgba(var(--brown-medium-rgb), 0.12),0 2px 8px rgba(var(--brown-medium-rgb), 0.08);border:1.5px solid var(--yellow-light);z-index:100;display:flex;flex-direction:column;padding:6px;opacity:0;visibility:hidden;transform:translateY(-10px);transition:all .2s cubic-bezier(.25,1,.5,1)}
.search-suggestions.show{opacity:1;visibility:visible;transform:translateY(0)}
.suggestion-item{padding:10px 14px;display:flex;align-items:center;gap:12px;border-radius:12px;cursor:pointer;transition:all 150ms ease;color:var(--brown-medium);font-weight:500;font-size:15px}
.suggestion-item:hover{background:var(--yellow-mist)}
.suggestion-icon{color:var(--brown-light);font-size:16px;display:flex;align-items:center;justify-content:center;width:24px;height:24px;flex-shrink:0;border-radius:6px;background:var(--bg-canvas);transition:color .2s ease}
.suggestion-item:hover .suggestion-icon{color:var(--brown-gold)}

/* 统计信息栏 */
.stats-bar{display:flex;gap:16px;margin-bottom:32px;flex-wrap:wrap}
.stat-chip{display:flex;align-items:center;gap:8px;padding:10px 20px;border-radius:16px;font-size:14px;font-weight:700;color:var(--brown-dark);transition:all .2s ease;box-shadow:var(--shadow-soft)}
.stat-chip:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover)}
.stat-chip.mistake{background:linear-gradient(135deg,var(--orange-mist),var(--orange-lighter));border:1px solid rgba(var(--orange-rgb), 0.3)}
.stat-chip.favorite{background:linear-gradient(135deg,var(--yellow-lighter),var(--yellow-light));border:1px solid rgba(var(--yellow-rgb), 0.4)}
.stat-chip.total{background:linear-gradient(135deg,var(--blue-mist),var(--blue-lighter));border:1px solid rgba(var(--blue-light-rgb), 0.3)}
.stat-num{font-size:20px;font-weight:900}

/* 题目卡片网格 */
.question-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:24px;margin-bottom:48px}

.question-card{background:linear-gradient(180deg,rgba(var(--white-rgb), 0.85) 0%,rgba(var(--surface-soft-rgb), 0.5) 100%);backdrop-filter:blur(8px);border:1.5px solid rgba(var(--white-rgb), 0.6);border-radius:20px;padding:24px;box-shadow:0 4px 12px rgba(var(--border-muted-rgb), 0.12);transition:all .3s cubic-bezier(.25,1,.5,1);cursor:pointer;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.question-card:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(var(--border-muted-rgb), 0.2);border-color:rgba(var(--orange-rgb), 0.4)}
.question-card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;border-radius:20px 20px 0 0}
.question-card.mistake-card::before{background:linear-gradient(90deg,var(--orange),var(--orange-light))}
.question-card.favorite-card::before{background:linear-gradient(90deg,var(--yellow),var(--yellow-light))}

.card-top-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.card-type-icon{width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;box-shadow:0 2px 8px rgba(var(--border-muted-rgb), 0.15)}
.card-type-icon.mistake-icon{background:linear-gradient(135deg,var(--orange-mist),var(--orange-lighter))}
.card-type-icon.favorite-icon{background:linear-gradient(135deg,var(--yellow-lighter),var(--yellow-light))}

.card-title{font-size:16px;font-weight:700;color:var(--brown-dark);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.card-tags{display:flex;flex-wrap:wrap;gap:6px}
.card-tag{padding:5px 12px;border-radius:8px;font-size:13px;font-weight:700;letter-spacing:0.02em}
.card-tag.blue{background:var(--purple-mist);color:var(--purple)}
.card-tag.purple{background:var(--green-mist);color:var(--green-deep)}
.card-tag.green{background:var(--purple-mist);color:var(--purple)}
.card-tag.orange{background:var(--green-mist);color:var(--green-deep)}

.card-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:12px;border-top:1px dashed rgba(var(--border-muted-rgb), 0.2)}
.card-time{font-size:12px;color:var(--brown-light);font-weight:600}
.card-action-btn{width:32px;height:32px;border-radius:10px;border:none;background:var(--bg-canvas);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s ease;box-shadow:0 2px 6px rgba(var(--border-muted-rgb), 0.15);color:var(--brown-medium)}
.card-action-btn:hover{transform:scale(1.1);box-shadow:0 4px 10px rgba(var(--border-muted-rgb), 0.25)}
.card-action-btn.delete:hover{color:var(--warn-text);background:var(--warn-bg)}

/* 空状态 */
.empty-state{display:flex;flex-direction:column;align-items:center;text-align:center;padding:80px 40px;background:rgba(var(--surface-soft-rgb), 0.6);border-radius:28px;border:2px dashed rgba(var(--border-muted-rgb), 0.25);box-shadow:var(--shadow-soft)}
.empty-state-icon{font-size:72px;margin-bottom:24px;filter:drop-shadow(0 4px 8px rgba(var(--orange-rgb), 0.3))}
.empty-state-title{font-size:22px;font-weight:800;color:var(--brown-dark);margin-bottom:10px}
.empty-state-desc{font-size:15px;color:var(--brown-medium);line-height:1.6;max-width:400px}

/* 模态对话框 */
@keyframes modalFadeIn{from{opacity:0}to{opacity:1}}
@keyframes modalSlideUp{from{opacity:0;transform:translateY(30px) scale(0.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal-overlay{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;background:rgba(var(--surface-soft-rgb), 0.8);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:modalFadeIn .25s ease}
.modal-card{position:relative;width:min(780px,calc(100vw - 48px));max-height:calc(100vh - 80px);border-radius:24px;background:rgba(var(--white-rgb), 0.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:var(--shadow-hover);border:1.5px solid rgba(var(--yellow-light-rgb), 0.5);overflow-y:auto;animation:modalSlideUp .35s cubic-bezier(0.16,1,0.3,1)}
.modal-accent-bar{height:4px;width:100%;background:linear-gradient(90deg,var(--orange) 0%,var(--yellow) 50%,var(--blue-light) 100%)}
.modal-content{padding:36px 40px 32px;display:flex;flex-direction:column;gap:20px}
.modal-top-row{display:flex;align-items:center;justify-content:space-between}
.modal-nav-info{display:flex;align-items:center;gap:12px}
.modal-nav-btn{width:38px;height:38px;border-radius:12px;border:none;background:var(--bg-canvas);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s ease;box-shadow:var(--shadow-soft);color:var(--brown-medium);font-size:18px;font-weight:700}
.modal-nav-btn:hover:not(:disabled){background:var(--yellow-mist);transform:translateY(-1px);box-shadow:var(--shadow-hover);color:var(--brown-dark)}
.modal-nav-btn:disabled{opacity:0.35;cursor:not-allowed;transform:none}
.modal-counter{font-size:15px;font-weight:700;color:var(--brown-medium);min-width:50px;text-align:center}
.modal-close-btn{width:36px;height:36px;border-radius:50%;border:1.5px solid rgba(var(--border-muted-rgb), 0.25);background:var(--bg-canvas);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s ease;box-shadow:0 2px 8px rgba(var(--border-muted-rgb), 0.15);color:var(--brown-dark)}
.modal-close-btn:hover{transform:rotate(90deg) scale(1.1);border-color:var(--orange-light);box-shadow:0 4px 12px rgba(var(--orange-rgb), 0.25)}
.modal-knowledge-tag{display:inline-flex;align-items:center;gap:6px;padding:6px 16px;border-radius:9999px;background:linear-gradient(135deg,var(--orange),var(--yellow));color:var(--white);font-size:15px;font-weight:700;text-shadow:0 1px 2px rgba(var(--brown-medium-rgb), 0.3);box-shadow:0 2px 8px rgba(var(--orange-rgb), 0.35);align-self:flex-start}
.modal-stem{font-size:18px;font-weight:600;color:var(--text-primary);line-height:1.7;white-space:pre-wrap}
.modal-options{display:flex;flex-direction:column;gap:10px}
.modal-option{display:flex;align-items:center;gap:16px;width:100%;padding:14px 18px;border-radius:16px;border:2px solid var(--yellow-light);background:var(--bg-canvas);box-shadow:var(--shadow-soft);font-family:inherit;font-size:15px;color:var(--text-primary);text-align:left;transition:all .15s ease;cursor:default}
.modal-option.correct{border-color:rgba(var(--success-text-rgb), 0.28);background:var(--success-bg)}
.modal-option.correct .modal-option-label{background:linear-gradient(135deg,var(--green-pale),var(--green-vivid));color:var(--white)}
.modal-option.wrong{border-color:rgba(var(--danger-strong-rgb), 0.28);background:var(--danger-surface)}
.modal-option.wrong .modal-option-label{background:linear-gradient(135deg,var(--danger-light),var(--danger));color:var(--white)}
.modal-option-label{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--yellow-lighter),var(--yellow-light));box-shadow:3px 3px 6px rgba(var(--border-muted-rgb), 0.25),-3px -3px 6px rgba(var(--white-rgb), 0.9);font-size:14px;font-weight:700;color:var(--brown-medium);flex-shrink:0}
.modal-option-text{flex:1;line-height:1.5;font-weight:500}
.modal-option-badge{font-size:13px;font-weight:700;padding:3px 12px;border-radius:8px;flex-shrink:0}
.modal-option-badge.correct-badge{background:var(--green-pale);color:var(--success-text)}
.modal-option-badge.wrong-badge{background:var(--warn-bg);color:var(--warn-text)}
.modal-meta{display:flex;align-items:center;gap:16px;padding-top:16px;border-top:1px dashed rgba(var(--border-muted-rgb), 0.25);flex-wrap:wrap}
.modal-meta-item{font-size:13px;font-weight:600;color:var(--brown-light);display:flex;align-items:center;gap:6px}
.modal-tags{display:flex;flex-wrap:wrap;gap:6px}
@media(max-width:640px){.modal-content{padding:24px 20px 20px}.modal-card{width:calc(100vw - 24px);max-height:calc(100vh - 40px)}}
</style>

<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* Safe Icon */
const Icon = ({ name, size = 20, className = "" }) => {
  const wrapRef = useRef(null);
  useEffect(() => {
    const el = wrapRef.current;
    if (!el || !window.lucide) return;
    el.innerHTML = '';
    const i = document.createElement('i');
    i.setAttribute('data-lucide', name);
    i.style.width = size + 'px';
    i.style.height = size + 'px';
    if (className) i.className = className;
    el.appendChild(i);
    window.lucide.createIcons({ nameAttr: 'data-lucide', root: el });
  }, [name, size, className]);
  return <span ref={wrapRef} style={{ display: 'inline-flex', alignItems: 'center', justifyContent: 'center', width: size, height: size }} />;
};

/* Mock 数据 */
const TAG_COLORS = ["blue", "purple", "green", "orange"];

const MOCK_MISTAKES = [
  { id: "m1", title: "以下哪个是 Python 中定义函数的关键字？", tags: ["函数定义"], time: "2025-03-24 14:30", knowledge: "函数定义", options: ["function", "def", "func", "define"], answer: "def", userAnswer: "function" },
  { id: "m2", title: "在 Python 中，以下哪个数据类型是不可变的？", tags: ["数据类型"], time: "2025-03-23 10:15", knowledge: "数据类型", options: ["list（列表）", "dict（字典）", "tuple（元组）", "set（集合）"], answer: "tuple（元组）", userAnswer: "list（列表）" },

  { id: "m4", title: "Python 中用于捕获异常的关键字组合是？", tags: ["异常处理"], time: "2025-03-21 09:20", knowledge: "异常处理", options: ["try...catch", "try...except", "begin...rescue", "do...catch"], answer: "try...except", userAnswer: "try...catch" },

  { id: "m6", title: "关于 Python 的 GIL，以下哪个说法是正确的？", tags: ["GIL"], time: "2025-03-19 15:10", knowledge: "GIL", options: ["GIL 让 Python 支持真正的多线程并行", "GIL 是全局解释器锁，同一时刻只允许一个线程执行字节码", "GIL 只影响多进程", "去掉 GIL 不会带来任何副作用"], answer: "GIL 是全局解释器锁，同一时刻只允许一个线程执行字节码", userAnswer: "GIL 让 Python 支持真正的多线程并行" },

const MOCK_FAVORITES = [
  { id: "f1", title: "二分查找算法的时间复杂度是多少？", tags: ["二分查找"], time: "2025-03-24 18:00", knowledge: "二分查找", options: ["O(n)", "O(log n)", "O(n log n)", "O(1)"], answer: "O(log n)" },

  { id: "f3", title: "递归与分治策略的核心区别是什么？", tags: ["递归"], time: "2025-03-22 20:15", knowledge: "递归与分治", options: ["递归是编程技巧，分治是算法思想", "两者完全相同", "分治不能用递归实现", "递归效率一定比分治高"], answer: "递归是编程技巧，分治是算法思想" },

const MOCK_SUGGESTIONS = {
  mistakes: [
    { id: 1, icon: "❌", title: "Python 中定义函数的关键字" },
    { id: 2, icon: "❌", title: "不可变数据类型" },

const App = () => {
  const [activeTab, setActiveTab] = useState("mistakes");
  const [titleText, setTitleText] = useState("");
  const [searchQuery, setSearchQuery] = useState("");
  const [showSuggestions, setShowSuggestions] = useState(false);
  const [suggestions, setSuggestions] = useState([]);
  const [mistakes, setMistakes] = useState(MOCK_MISTAKES);
  const [favorites, setFavorites] = useState(MOCK_FAVORITES);
  const [modalOpen, setModalOpen] = useState(false);
  const [modalIndex, setModalIndex] = useState(0);

  // 打字机
  useEffect(() => {
    const fullTitle = "错题本 / 收藏夹";
    let i = 0;
    const timer = setInterval(() => {
      setTitleText(fullTitle.slice(0, i + 1));
      i++;
      if (i >= fullTitle.length) clearInterval(timer);
    }, 100);
    return () => clearInterval(timer);
  }, []);

  // 搜索联想
  useEffect(() => {
    if (!searchQuery.trim()) { setSuggestions([]); return; }
    const list = MOCK_SUGGESTIONS[activeTab] || [];
    const allItems = activeTab === "mistakes" ? mistakes : favorites;
    const filtered = allItems.filter(item =>
      item.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
      item.tags.some(t => t.toLowerCase().includes(searchQuery.toLowerCase()))
    ).map((item, idx) => ({
      id: item.id,
      icon: activeTab === "mistakes" ? "❌" : "⭐",
      title: item.title,
    }));
    setSuggestions(filtered.slice(0, 5));
  }, [searchQuery, activeTab]);

  const currentItems = activeTab === "mistakes" ? mistakes : favorites;
  const filteredItems = searchQuery.trim()
    ? currentItems.filter(item =>
        item.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
        item.tags.some(t => t.toLowerCase().includes(searchQuery.toLowerCase()))
      )
    : currentItems;

  const handleDelete = (id) => {
    if (activeTab === "mistakes") {
      setMistakes(prev => prev.filter(m => m.id !== id));
    } else {
      setFavorites(prev => prev.filter(f => f.id !== id));
    }
  };

  const switchTab = (tab) => {
    setActiveTab(tab);
    setSearchQuery("");
    setSuggestions([]);
  };

  return (
    <div className="immersive-layout">
      <div className="immersive-container">
        {/* 返回按钮 */}
        <div className="header-actions">
          <a href="dashboard-preview.html" className="btn-back">
            <Icon name="arrow-left" size={16} />
            返回主页面
          </a>
        </div>

        {/* 标题区 */}
        <header className="page-header">
          <h1 className="page-title">
            <span>{titleText}</span>
            <span className="typewriter-cursor">|</span>
          </h1>
          <p className="page-subtitle">智能收集错题与收藏题目，精准定位薄弱环节</p>
        </header>

        {/* Tab 切换 */}
        <div className="tab-container">
          <div className="tab-slider" data-mode={activeTab} />
          <button
            type="button"
            className="tab-btn"
            data-active={activeTab === "mistakes" ? "true" : "false"}
            onClick={() => switchTab("mistakes")}
          >
            📝 错题本
          </button>
          <button
            type="button"
            className="tab-btn"
            data-active={activeTab === "favorites" ? "true" : "false"}
            onClick={() => switchTab("favorites")}
          >
            ⭐ 收藏夹
          </button>
        </div>

        {/* 搜索栏 */}
        <div className="search-container">
          <div className="search-icon">
            <Icon name="search" size={20} />
          </div>
          <input
            type="text"
            className="input-search"
            placeholder={activeTab === "mistakes" ? "搜索错题..." : "搜索收藏的题目..."}
            value={searchQuery}
            onChange={(e) => setSearchQuery(e.target.value)}
            onFocus={() => setShowSuggestions(true)}
            onBlur={() => setTimeout(() => setShowSuggestions(false), 200)}
          />
          <div className={"search-suggestions" + (showSuggestions && suggestions.length > 0 ? " show" : "")}>
            {suggestions.map((item) => (
              <div
                key={item.id}
                className="suggestion-item"
                onMouseDown={() => setSearchQuery(item.title)}
              >
                <div className="suggestion-icon">{item.icon}</div>
                <span>{item.title}</span>
              </div>
            ))}
          </div>
        </div>

        {/* 统计信息 */}
        <div className="stats-bar">
          <div className={`stat-chip ${activeTab === "mistakes" ? "mistake" : "favorite"}`}>
            <span>{activeTab === "mistakes" ? "📝" : "⭐"}</span>
            <span>共</span>
            <span className="stat-num">{filteredItems.length}</span>
            <span>题</span>
          </div>
          {searchQuery.trim() && (
            <div className="stat-chip total">
              <Icon name="filter" size={14} />
              <span>筛选自 {currentItems.length} 题</span>
            </div>
          )}
        </div>

        {/* 题目卡片网格 */}
        {filteredItems.length > 0 ? (
          <div className="question-grid">
            {filteredItems.map((item, idx) => (
              <div
                key={item.id}
                className={`question-card ${activeTab === "mistakes" ? "mistake-card" : "favorite-card"}`}
                onClick={() => { setModalIndex(idx); setModalOpen(true); }}
              >
                <div className="card-top-row">
                  <div className={`card-type-icon ${activeTab === "mistakes" ? "mistake-icon" : "favorite-icon"}`}>
                    {activeTab === "mistakes" ? "❌" : "⭐"}
                  </div>
                </div>
                <div className="card-title">{item.title}</div>
                <div className="card-tags">
                  {item.tags.map((tag, idx) => (
                    <span key={idx} className={`card-tag ${TAG_COLORS[idx % TAG_COLORS.length]}`}>
                      {tag}
                    </span>
                  ))}
                </div>
                <div className="card-bottom">
                  <span className="card-time">🕐 {item.time}</span>
                  <button
                    className="card-action-btn delete"
                    title="移除"
                    onClick={(e) => { e.stopPropagation(); handleDelete(item.id); }}
                  >
                    <Icon name="trash-2" size={14} />
                  </button>
                </div>
              </div>
            ))}
          </div>
        ) : (
          <div className="empty-state">
            <div className="empty-state-icon">
              {activeTab === "mistakes" ? "📝" : "⭐"}
            </div>
            <h2 className="empty-state-title">
              {searchQuery.trim()
                ? "没有找到匹配的题目"
                : activeTab === "mistakes"
                  ? "还没有错题记录"
                  : "还没有收藏的题目"
              }
            </h2>
            <p className="empty-state-desc">
              {searchQuery.trim()
                ? "试试换个关键词搜索吧"
                : activeTab === "mistakes"
                  ? "完成课前测和日常练习时，答错的题目会自动收集到这里"
                  : "在做题过程中，点击收藏按钮即可将题目保存到这里"
              }
            </p>
          </div>
        )}
      </div>

      {/* 题目详情模态对话框 */}
      {modalOpen && filteredItems.length > 0 && (() => {
        const item = filteredItems[modalIndex];
        if (!item) return null;
        const isMistake = activeTab === "mistakes";
        const total = filteredItems.length;
        return (
          <div className="modal-overlay" onClick={() => setModalOpen(false)}>
            <div className="modal-card" onClick={(e) => e.stopPropagation()}>
              <div className="modal-accent-bar" />
              <div className="modal-content">
                {/* 顶部：导航 + 关闭 */}
                <div className="modal-top-row">
                  <div className="modal-nav-info">
                    <button
                      className="modal-nav-btn"
                      disabled={modalIndex <= 0}
                      onClick={() => setModalIndex(i => Math.max(0, i - 1))}
                      title="上一题"
                    >‹</button>
                    <span className="modal-counter">{modalIndex + 1} / {total}</span>
                    <button
                      className="modal-nav-btn"
                      disabled={modalIndex >= total - 1}
                      onClick={() => setModalIndex(i => Math.min(total - 1, i + 1))}
                      title="下一题"
                    >›</button>
                  </div>
                  <button className="modal-close-btn" onClick={() => setModalOpen(false)} title="关闭">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                      <line x1="18" y1="6" x2="6" y2="18"></line>
                      <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                  </button>
                </div>

                {/* 知识点标签 */}
                <span className="modal-knowledge-tag">
                  {item.knowledge}
                </span>

                {/* 题干 */}
                <div className="modal-stem">{item.title}</div>

                {/* 选项列表 */}
                <div className="modal-options">
                  {item.options.map((opt, oi) => {
                    const isCorrect = opt === item.answer;
                    const isUserWrong = isMistake && item.userAnswer === opt && opt !== item.answer;
                    let cls = "modal-option";
                    if (isCorrect) cls += " correct";
                    else if (isUserWrong) cls += " wrong";
                    return (
                      <div key={oi} className={cls}>
                        <span className="modal-option-label">{String.fromCharCode(65 + oi)}</span>
                        <span className="modal-option-text">{opt}</span>
                        {isCorrect && <span className="modal-option-badge correct-badge">✓ 正确答案</span>}
                        {isUserWrong && <span className="modal-option-badge wrong-badge">✗ 你的选择</span>}
                      </div>
                    );
                  })}
                </div>

                {/* 底部元信息 */}
                <div className="modal-meta">
                  <span className="modal-meta-item">🕐 {item.time}</span>
                </div>
              </div>
            </div>
          </div>
        );
      })()}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
