<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Sandbox3D 3D模型沙盒 · AI个性化学习助手</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
    <link rel="stylesheet" href="variables.css" />
<style>
*{box-sizing:border-box;margin:0;padding:0}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border-muted);border-radius:4px}::-webkit-scrollbar-thumb:hover{background:var(--border-strong)}
body{font-family:"Inter",system-ui,"PingFang SC",sans-serif;color:var(--text-primary);background:var(--bg-canvas)}
.il{min-height:100vh;display:flex;justify-content:center;overflow-y:auto;background:var(--bg-canvas)}
.ic{width:100%;max-width:1200px;padding:40px 32px 80px;display:flex;flex-direction:column}
.ha{display:flex;align-items:center;margin-bottom:24px}
.bb{display:inline-flex;align-items:center;gap:6px;background:rgba(var(--white-rgb), .6);backdrop-filter:blur(8px);color:var(--brown-dark);text-decoration:none;font-size:14px;font-weight:700;padding:8px 16px;border-radius:999px;transition:all .2s;border:1px solid rgba(var(--white-rgb), .8);box-shadow:0 4px 12px rgba(var(--border-muted-rgb), .4)}
.bb:hover{background:rgba(var(--white-rgb), .9);color:var(--brown-medium);transform:translateY(-1px);box-shadow:0 6px 16px rgba(var(--border-muted-rgb), .5)}
.ph{margin-bottom:40px}
.pt{font-size:64px;font-weight:900;margin-bottom:12px;background:linear-gradient(135deg,var(--brown-dark) 0%,var(--orange) 60%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;display:flex;align-items:center;letter-spacing:-1px}
.tc{color:var(--orange);animation:blink 1s step-end infinite;margin-left:4px;font-weight:400;-webkit-text-fill-color:var(--orange);text-shadow:0 0 10px rgba(var(--orange-rgb), .5)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.ps{font-size:24px;font-weight:700;color:var(--brown-medium)}
.sh{font-size:18px;font-weight:700;color:var(--brown-dark);margin-bottom:20px}
.mm{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:32px;margin-bottom:48px}
.mc{background:linear-gradient(180deg,rgba(var(--white-rgb), .8) 0%,rgba(var(--surface-soft-rgb), .4) 100%);backdrop-filter:blur(8px);border:1px solid rgba(var(--white-rgb), .6);border-radius:16px;overflow:hidden;box-shadow:0 4px 12px rgba(var(--border-muted-rgb), .15);transition:all .3s cubic-bezier(.25,1,.5,1);cursor:pointer}
.mc:hover{transform:translateY(-6px);box-shadow:0 12px 24px rgba(var(--border-muted-rgb), .2);border-color:rgba(var(--orange-rgb), .4)}
.mt{width:100%;height:160px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;color:var(--brown-gold)}
.mt::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at top right,rgba(var(--white-rgb), .4) 0%,transparent 60%)}
.mc:nth-child(1) .mt{background:linear-gradient(135deg,var(--blue-lighter),var(--blue-mist))}.mc:nth-child(2) .mt{background:linear-gradient(135deg,var(--purple-lighter),var(--purple-mist))}.mc:nth-child(3) .mt{background:linear-gradient(135deg,var(--green-lighter),var(--green-mist))}.mc:nth-child(4) .mt{background:linear-gradient(135deg,var(--yellow-lighter),var(--yellow-mist))}.mc:nth-child(5) .mt{background:linear-gradient(135deg,var(--orange-lighter),var(--orange-mist))}
.mn{font-size:16px;font-weight:600;color:var(--brown-medium);padding:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc{background:linear-gradient(180deg,rgba(var(--white-rgb), .9) 0%,rgba(var(--surface-soft-rgb), .6) 100%);backdrop-filter:blur(12px);border-radius:24px;padding:32px;box-shadow:0 8px 32px rgba(var(--border-muted-rgb), .15);border:1px solid rgba(var(--white-rgb), .8);border-top:1px solid var(--white);margin-bottom:48px;position:relative;overflow:hidden}
.cc::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(270deg,var(--yellow),var(--orange-light),var(--purple-light),var(--blue-light))}
.ct{font-size:18px;font-weight:700;margin-bottom:16px;color:var(--brown-dark)}
.tp{width:100%;min-height:192px;border-radius:16px;border:2px solid transparent;padding:20px;font-size:16px;line-height:1.6;background:linear-gradient(var(--bg-canvas),var(--bg-canvas)) padding-box,linear-gradient(135deg,rgba(var(--border-muted-rgb), .3),rgba(var(--white-rgb), .6)) border-box;box-shadow:inset 0 2px 4px rgba(var(--border-muted-rgb), .05);resize:vertical;outline:none;color:var(--text-primary);margin-bottom:24px;transition:all .3s}
.tp:focus{background:linear-gradient(var(--bg-canvas),var(--bg-canvas)) padding-box,linear-gradient(135deg,var(--blue-light),var(--purple-light)) border-box;box-shadow:0 4px 12px rgba(var(--purple-rgb), .15)}
.dr{display:flex;gap:12px;margin-bottom:32px}
.bd{padding:12px 36px;border-radius:24px;font-size:16px;font-weight:700;cursor:pointer;border:none;background:rgba(var(--white-rgb), .6);color:var(--brown-medium);transition:all .3s cubic-bezier(.25,1,.5,1);box-shadow:0 4px 12px rgba(var(--border-muted-rgb), .3)}
.bd:hover{transform:translateY(-2px);background:rgba(var(--white-rgb), .9);box-shadow:0 8px 24px rgba(var(--border-muted-rgb), .4)}
.bd.active{background:linear-gradient(135deg,var(--yellow-light),var(--orange-light));color:var(--brown-deep);box-shadow:0 4px 12px rgba(var(--orange-rgb), .3)}
.ar{display:flex;justify-content:space-between;align-items:center}
.br{display:flex;align-items:center;gap:8px;padding:12px 24px;border-radius:24px;background:linear-gradient(var(--orange-mist),var(--yellow-mist)) padding-box,linear-gradient(135deg,var(--orange-light),var(--yellow-light)) border-box;color:var(--brown-dark);font-weight:700;font-size:15px;border:2px solid transparent;cursor:pointer;transition:all .3s cubic-bezier(.25,1,.5,1);box-shadow:0 2px 8px rgba(var(--orange-pale-rgb), .37)}
.br:hover{background:linear-gradient(var(--orange-lighter),var(--yellow-lighter)) padding-box,linear-gradient(135deg,var(--orange),var(--yellow)) border-box;color:var(--brown-deep);box-shadow:0 4px 12px rgba(var(--orange-soft-rgb), .36);transform:translateY(-2px)}
.br:disabled{opacity:.6;cursor:not-allowed;transform:none}
.bp{padding:16px 32px;border-radius:24px;border:none;background:linear-gradient(135deg,var(--yellow-light),var(--orange-light));color:var(--brown-deep);font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 4px 12px rgba(var(--orange-rgb), .4);transition:all .3s cubic-bezier(.25,1,.5,1);display:flex;align-items:center;gap:8px;min-width:180px;justify-content:center}
.bp:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(var(--orange-rgb), .5)}
.bp:active{transform:scale(.98)}
.bp:disabled{opacity:.7;cursor:not-allowed;transform:none;box-shadow:none}
.rs{width:100%;aspect-ratio:16/9;background:linear-gradient(135deg,var(--yellow-lighter) 0%,var(--orange-mist) 50%,var(--orange-lighter) 100%);border-radius:24px;overflow:hidden;box-shadow:0 8px 32px rgba(var(--border-muted-rgb), .2),0 0 0 1px rgba(var(--white-rgb), .4);margin-bottom:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.rs::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 40px rgba(var(--border-muted-rgb), .15);pointer-events:none;border-radius:24px}
.sl{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:1;position:relative}
.shal{position:absolute;width:240px;height:240px;border-radius:9999px;background:radial-gradient(circle,rgba(var(--brown-gold-rgb), .25) 0%,rgba(var(--brown-gold-rgb), .08) 46%,rgba(var(--brown-gold-rgb), 0) 72%);filter:blur(14px);animation:hp 2s ease-in-out infinite}
@keyframes hp{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.1)}}
.ssp{width:56px;height:56px;border-radius:9999px;border:4px solid rgba(var(--brown-gold-rgb), .2);border-top-color:var(--brown-gold);animation:spin .9s linear infinite;z-index:1}
.slt{font-size:18px;font-weight:700;color:var(--brown-dark);z-index:1}
.slm{font-size:14px;color:var(--brown-medium);z-index:1;max-width:400px;text-align:center;line-height:1.5}
.su{animation:slideUp .6s cubic-bezier(.2,.8,.2,1)}
@keyframes slideUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
.as{animation:spin 1s linear infinite}
@keyframes spin{100%{transform:rotate(360deg)}}
.eh{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px;color:var(--brown-light);gap:12px;grid-column:1/-1}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const{useState,useEffect,useRef,useCallback}=React;

/* Safe Icon: renders lucide icon into a wrapper div without conflicting with React DOM */
const Icon=({name,size=20,className=""})=>{
  const wrapRef=useRef(null);
  useEffect(()=>{
    const el=wrapRef.current;
    if(!el||!window.lucide) return;
    // Clear previous content
    el.innerHTML='';
    // Create a fresh <i> element for lucide
    const i=document.createElement('i');
    i.setAttribute('data-lucide',name);
    i.style.width=size+'px';
    i.style.height=size+'px';
    if(className) i.className=className;
    el.appendChild(i);
    window.lucide.createIcons({nameAttr:'data-lucide',root:el});
  },[name,size,className]);
  return <span ref={wrapRef} style={{display:'inline-flex',alignItems:'center',justifyContent:'center',width:size,height:size}}/>;
};

const RECS=[{id:"r1",concept:"遍历二叉树",theme:"tree"},{id:"r2",concept:"冒泡排序",theme:"sort"},{id:"r3",concept:"图搜索",theme:"graph"}];

const themeSVG=(t)=>{
  const c={
    sort:{c:"var(--orange-deep)",p:'<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 20V10M12 20V4M6 20v-6"/>'},
    tree:{c:"var(--success-text)",p:'<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6a2 2 0 00-2 2v2m16-4a2 2 0 00-2-2h-2m-8 2a2 2 0 00-2-2H4"/>'},
    graph:{c:"var(--blue)",p:'<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v8l9-11h-7z"/>'},
    default:{c:"var(--yellow-gold)",p:'<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>'}
  }[t]||{c:"var(--yellow-gold)",p:'<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>'};
  return <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke={c.c} dangerouslySetInnerHTML={{__html:c.p}} style={{position:"relative",zIndex:1}}/>;
};

const inferT=(s)=>{if(s.includes("排序"))return"sort";if(s.includes("树"))return"tree";if(s.includes("图")||s.includes("搜索")||s.includes("路径"))return"graph";return"default"};
const themeClass=(t)=>({sort:"ts",tree:"tt",graph:"tg",default:"td"}[t]||"td");
const SK="sandbox3d_history";
const SK_CI="sandbox3d_colorIdx";

// 5色循环：蓝-紫-绿-黄-橙
const COVER_COLORS=[
  "linear-gradient(135deg,var(--blue-lighter),var(--blue-mist))",
  "linear-gradient(135deg,var(--purple-lighter),var(--purple-mist))",
  "linear-gradient(135deg,var(--green-lighter),var(--green-mist))",
  "linear-gradient(135deg,var(--yellow-lighter),var(--yellow-mist))",
  "linear-gradient(135deg,var(--orange-lighter),var(--orange-mist))",
];

// Mock 初始历史数据（蓝紫绿三色，colorIndex 0/1/2）
const initialHistory=[
  {id:"h1",concept:"汉诺塔递归",colorIndex:0,timestamp:Date.now()-3600000},
  {id:"h2",concept:"快速排序可视化",colorIndex:1,timestamp:Date.now()-7200000},
  {id:"h3",concept:"二叉搜索树遍历",colorIndex:2,timestamp:Date.now()-10800000},
];

const App=()=>{
  const[diff,setDiff]=useState("入门");
  const[concept,setC]=useState("");
  const[gen,setGen]=useState(false);
  const[done,setDone]=useState(false);
  const[msgs,setMsgs]=useState([]);
  const[title,setTitle]=useState("");
  const[html,setHtml]=useState("");
  const[hist,setHist]=useState(()=>{try{const s=localStorage.getItem(SK);if(s){const p=JSON.parse(s);return p.length>0?p:initialHistory}return initialHistory}catch{return initialHistory}});
  const[nextCI,setNextCI]=useState(()=>{try{const s=localStorage.getItem(SK_CI);return s?parseInt(s,10):3}catch{return 3}});
  const ivRef=useRef(null);

  useEffect(()=>{const f="3D 模型沙盒";let i=0;const t=setInterval(()=>{setTitle(f.slice(0,i+1));if(++i>=f.length)clearInterval(t)},120);return()=>clearInterval(t)},[]);
  useEffect(()=>{localStorage.setItem(SK,JSON.stringify(hist))},[hist]);
  useEffect(()=>{localStorage.setItem(SK_CI,String(nextCI))},[nextCI]);

  const doGen=useCallback(()=>{
    if(!concept.trim())return;
    setGen(true);setDone(false);setMsgs([]);setHtml("");
    const ms=["正在解析知识点语义…","构建 3D 场景拓扑结构…","生成交互式空间资产…","渲染光照与材质…","注入物理模拟引擎…","优化着色器性能…","最终合成与封装…"];
    let i=0;
    ivRef.current=setInterval(()=>{
      if(i<ms.length){setMsgs(p=>[...p,ms[i]]);i++}
      else{
        clearInterval(ivRef.current);
        const c=concept.trim();
        setTimeout(()=>{
          setGen(false);setDone(true);
          setHtml('<html><body style="margin:0;display:flex;align-items:center;justify-content:center;height:100vh;background:linear-gradient(135deg,var(--surface-soft),var(--orange-warm));font-family:Inter,system-ui,sans-serif"><div style="text-align:center"><div style="font-size:72px;margin-bottom:16px">🧊</div><h2 style="color:var(--brown-dark);font-size:24px">3D 模型: '+c+'</h2><p style="color:var(--brown-medium);margin-top:8px">交互式 3D 可视化已就绪</p></div></body></html>');
          const ci=nextCI;
          setNextCI(ci+1);
          const r={id:Date.now().toString(),concept:c,theme:inferT(c),colorIndex:ci,timestamp:Date.now()};
          setHist(p=>[r,...p.filter(h=>h.concept!==r.concept)].slice(0,10));
        },800);
      }
    },600);
  },[concept,nextCI]);

  const doReset=()=>{if(ivRef.current)clearInterval(ivRef.current);setC("");setDone(false);setMsgs([]);setGen(false);setHtml("")};
  const doSelect=(n)=>{setC(n);setDone(false);setMsgs([]);setHtml("")};

  return(
    <div className="il"><div className="ic">
      <div className="ha"><a href="dashboard-preview.html" className="bb"><Icon name="arrow-left" size={16}/>返回主页面</a></div>

      <header className="ph">
        <h1 className="pt"><span>{title}</span><span className="tc">|</span></h1>
        <p className="ps">你的专属 AIGC 3D 认知资产库</p>
      </header>

      <div><h3 className="sh">猜你需要</h3>
        <div className="mm">{RECS.map(m=>(
          <div className="mc" key={m.id} onClick={()=>doSelect(m.concept)}>
            <div className="mt"><Icon name="box" size={48}/></div>
            <h4 className="mn">{m.concept}</h4>
          </div>
        ))}</div>
      </div>

      <section className="cc">
        <h3 className="ct">控制台</h3>
        <textarea className="tp" placeholder="请输入你想生成 3D 模型的知识点，例如：汉诺塔递归过程、红黑树旋转、Dijkstra 最短路径…" value={concept} onChange={e=>setC(e.target.value)} disabled={gen}/>
        <div className="dr">{["入门","中等","专家"].map(l=>(<button key={l} className={"bd "+(diff===l?"active":"")} onClick={()=>setDiff(l)} disabled={gen}>{l}</button>))}</div>
        <div className="ar">
          <button className="br" onClick={doReset} disabled={gen}><Icon name="rotate-ccw" size={16}/>重新生成</button>
          <button className="bp" onClick={doGen} disabled={gen||!concept.trim()}>
            {gen?<><Icon name="loader" size={18} className="as"/>正在渲染…</>:<><Icon name="sparkles" size={18}/>在线生成</>}
          </button>
        </div>
      </section>

      <div className={"rs"+(done?" su":"")}>
        {done&&html
          ?<iframe title="3D Sandbox Result" srcDoc={html} style={{width:"100%",height:"100%",border:"none",zIndex:1}}/>
          :gen
            ?<div className="sl"><div className="shal"/><div className="ssp"/><p className="slt">正在渲染空间资产…</p>{msgs.length>0&&<p className="slm">{msgs[msgs.length-1]}</p>}</div>
            :<div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:16,color:"var(--brown-light)",zIndex:1}}>
              <Icon name="box" size={64}/>
              <span style={{fontSize:16,fontWeight:600,letterSpacing:"0.5px",color:"var(--brown-medium)"}}>生成的 3D 模型将在此处渲染</span>
            </div>
        }
      </div>

      <div><h3 className="sh">生成历史</h3>
        <div className="mm">
          {hist.length===0
            ?<div className="eh"><Icon name="archive" size={48}/><span style={{fontSize:15,fontWeight:600,color:"var(--brown-medium)"}}>暂无生成历史</span></div>
            :hist.map(m=>(
              <div className="mc" key={m.id} onClick={()=>doSelect(m.concept)}>
                <div className="mt" style={m.colorIndex!=null?{background:COVER_COLORS[m.colorIndex%5]}:{}}><Icon name="box" size={48}/></div>
                <h4 className="mn">{m.concept}</h4>
              </div>
            ))
          }
        </div>
      </div>
    </div></div>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
