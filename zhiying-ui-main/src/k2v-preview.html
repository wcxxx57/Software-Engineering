<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>K2V 知识点转视频工具 · AI个性化学习助手</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./variables.css" />

    <!-- React 18 CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>

    <!-- Lucide 图标 -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Babel 时时编译 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>

    <style>
      /* `:root` 变量已通过 variables.css 统一管理 */

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      /* Scrollbar Styling */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border-muted);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--border-strong);
      }

      body {
        font-family: "Inter", system-ui, "PingFang SC", sans-serif;
        color: var(--text-primary);
        background-color: var(--bg-canvas);
      }

      /* === 全屏沉浸布局 ImmersiveLayout === */
      .immersive-layout {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        overflow-y: auto;
        background-color: var(--bg-canvas);
      }

      .immersive-container {
        width: 100%;
        max-width: 1200px;
        padding: 40px 32px 80px;
        display: flex;
        flex-direction: column;
      }

      /* Header */
      .header-actions {
        display: flex;
        align-items: center;
        margin-bottom: 24px;
      }

      .btn-back {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: rgba(var(--white-rgb), 0.6);
        backdrop-filter: blur(8px);
        color: var(--brown-dark);
        text-decoration: none;
        font-size: 14px;
        font-weight: 700;
        padding: 8px 16px;
        border-radius: 999px;
        transition: all 0.2s ease;
        border: 1px solid rgba(var(--white-rgb), 0.8);
        box-shadow: 0 4px 12px rgba(var(--border-muted-rgb), 0.4);
      }
      .btn-back:hover {
        background: rgba(var(--white-rgb), 0.9);
        color: var(--brown-medium);
        transform: translateY(-1px);
        box-shadow: 0 6px 16px rgba(var(--border-muted-rgb), 0.5);
      }

      .btn-regenerate {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 24px;
        border-radius: 24px;
        background:
          linear-gradient(var(--yellow-mist), var(--orange-mist)) padding-box,
          linear-gradient(to right, var(--yellow-light), var(--orange-light))
            border-box;
        color: var(--brown-dark);
        font-weight: 700;
        font-size: 15px;
        border: 2px solid transparent;
        cursor: pointer;
        text-decoration: none;
        transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        box-shadow: 0 2px 8px rgba(var(--orange-pale-rgb), 0.37);
      }
      .btn-regenerate:hover {
        background:
          linear-gradient(var(--yellow-lighter), var(--orange-lighter))
            padding-box,
          linear-gradient(to right, var(--yellow), var(--orange)) border-box;
        color: var(--brown-deep);
        box-shadow: 0 4px 12px rgba(var(--orange-warm-rgb), 0.36);
        transform: translateY(-2px);
      }
      .btn-regenerate:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
      }

      .page-header {
        margin-bottom: 40px;
      }
      .page-title {
        font-size: 64px;
        font-weight: 900;
        margin-bottom: 12px;
        background: linear-gradient(
          135deg,
          var(--brown-dark) 0%,
          var(--orange) 60%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 4px 12px rgba(var(--brown-gold-rgb), 0.2);
        display: flex;
        align-items: center;
        letter-spacing: -1px;
      }
      .typewriter-cursor {
        color: var(--orange);
        animation: blink 1s step-end infinite;
        margin-left: 4px;
        font-weight: 400;
        -webkit-text-fill-color: var(--orange);
        text-shadow: 0 0 10px rgba(var(--orange-rgb), 0.5);
      }
      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0;
        }
      }
      .page-subtitle {
        font-size: 24px;
        font-weight: 700;
        color: var(--brown-medium);
      }

      /* Search Bar */
      .search-container {
        position: relative;
        width: 100%;
        margin-bottom: 48px;
        transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        z-index: 50;
      }
      .search-container:hover {
        transform: translateY(-2px);
      }
      .search-container::before {
        content: "";
        position: absolute;
        inset: -2px;
        background: linear-gradient(
          135deg,
          var(--yellow),
          var(--orange-light),
          var(--orange)
        );
        border-radius: 30px;
        opacity: 0.6;
        transition: opacity 0.3s ease;
        z-index: -1;
        filter: blur(2px);
      }
      .search-container:focus-within::before {
        opacity: 1;
        filter: blur(4px);
      }
      .input-search {
        width: 100%;
        height: 56px;
        border-radius: 28px;
        border: 2px solid transparent;
        background:
          linear-gradient(rgba(var(--surface-soft-rgb), 0.95), rgba(var(--surface-soft-rgb), 0.95))
            padding-box,
          linear-gradient(135deg, var(--yellow-light), var(--orange-light))
            border-box;
        backdrop-filter: blur(10px);
        box-shadow:
          inset 2px 2px 6px rgba(var(--border-muted-rgb), 0.1),
          inset -2px -2px 6px rgba(var(--white-rgb), 0.8),
          0 4px 12px rgba(var(--border-muted-rgb), 0.15);
        padding: 0 24px 0 56px;
        font-size: 16px;
        color: var(--text-primary);
        outline: none;
        transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      }
      .input-search::placeholder {
        color: var(--brown-light);
        font-weight: 500;
      }
      .input-search:focus {
        background:
          linear-gradient(var(--white), var(--white)) padding-box,
          linear-gradient(135deg, var(--yellow), var(--orange)) border-box;
        box-shadow:
          inset 2px 2px 4px rgba(var(--border-muted-rgb), 0.05),
          inset -2px -2px 4px rgba(var(--white-rgb), 0.9),
          0 8px 24px rgba(var(--yellow-rgb), 0.3);
        transform: scale(1.02);
      }
      .search-icon {
        position: absolute;
        left: 20px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--brown-light);
        transition: color 0.3s ease;
        pointer-events: none;
        z-index: 1;
      }
      .search-container:focus-within .search-icon {
        color: var(--orange);
      }

      /* 搜索联想下拉框 */
      .search-suggestions {
        position: absolute;
        top: calc(100% + 12px);
        left: 0;
        width: 100%;
        border-radius: 16px;
        background: rgba(var(--white-rgb), 0.95);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        box-shadow:
          0 8px 32px rgba(var(--brown-medium-rgb), 0.12),
          0 2px 8px rgba(var(--brown-medium-rgb), 0.08);
        border: 1.5px solid var(--yellow-light);
        z-index: 100;
        display: flex;
        flex-direction: column;
        padding: 6px;
        opacity: 0;
        visibility: hidden;
        transform: translateY(-10px);
        transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1);
      }
      .search-suggestions.show {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
      }
      .suggestion-item {
        padding: 10px 14px;
        display: flex;
        align-items: center;
        gap: 12px;
        border-radius: 12px;
        cursor: pointer;
        transition: all 150ms ease;
        color: var(--brown-medium);
        font-weight: 500;
        font-size: 15px;
      }
      .suggestion-item:hover {
        background: var(--yellow-mist);
      }
      .suggestion-icon {
        color: var(--brown-light);
        font-size: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 24px;
        flex-shrink: 0;
        border-radius: 6px;
        background: var(--bg-canvas);
        transition: color 0.2s ease;
      }
      .suggestion-item:hover .suggestion-icon {
        color: var(--brown-gold);
      }

      /* Video Matrix Grid */
      .video-matrix {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 32px;
        margin-bottom: 48px;
      }
      .video-card {
        background: linear-gradient(
          180deg,
          rgba(var(--white-rgb), 0.8) 0%,
          rgba(var(--surface-soft-rgb), 0.4) 100%
        );
        backdrop-filter: blur(8px);
        border: 1px solid rgba(var(--white-rgb), 0.6);
        border-radius: 16px;
        padding: 12px;
        box-shadow: 0 4px 12px rgba(var(--border-muted-rgb), 0.15);
        transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        cursor: pointer;
      }
      .video-card:hover {
        transform: translateY(-6px);
        box-shadow: 0 12px 24px rgba(var(--border-muted-rgb), 0.2);
        border-color: rgba(var(--orange-rgb), 0.4);
      }
      .video-thumbnail {
        width: 100%;
        aspect-ratio: 16/9;
        background: linear-gradient(
          135deg,
          var(--blue-lighter),
          var(--blue-mist)
        );
        border-radius: 12px;
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--brown-gold);
        position: relative;
        overflow: hidden;
        box-shadow: inset 0 2px 8px rgba(var(--black-rgb), 0.05);
      }
      .video-thumbnail::after {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(
          circle at top right,
          rgba(var(--white-rgb), 0.4) 0%,
          transparent 60%
        );
      }
      .video-card:nth-child(1) .video-thumbnail {
        background: linear-gradient(
          135deg,
          var(--blue-lighter),
          var(--blue-mist)
        );
      }
      .video-card:nth-child(2) .video-thumbnail {
        background: linear-gradient(
          135deg,
          var(--purple-lighter),
          var(--purple-mist)
        );
      }
      .video-card:nth-child(3) .video-thumbnail {
        background: linear-gradient(
          135deg,
          var(--green-lighter),
          var(--green-mist)
        );
      }
      .video-title {
        font-size: 16px;
        font-weight: 600;
        color: var(--brown-medium);
        padding: 0 4px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* Console / Generator Card */
      .console-card {
        background: linear-gradient(
          180deg,
          rgba(var(--white-rgb), 0.9) 0%,
          rgba(var(--surface-soft-rgb), 0.6) 100%
        );
        backdrop-filter: blur(12px);
        border-radius: 24px;
        padding: 32px;
        box-shadow: 0 8px 32px rgba(var(--border-muted-rgb), 0.15);
        border: 1px solid rgba(var(--white-rgb), 0.8);
        border-top: 1px solid var(--white);
        margin-bottom: 48px;
        position: relative;
        overflow: visible;
        z-index: 10;
      }
      .console-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(
          270deg,
          var(--yellow),
          var(--orange-light),
          var(--purple-light),
          var(--blue-light)
        );
      }
      .card-title {
        font-size: 18px;
        font-weight: 700;
        margin-bottom: 16px;
        color: var(--brown-dark);
      }

      .textarea-prompt {
        width: 100%;
        min-height: 192px;
        border-radius: 16px;
        border: 2px solid transparent;
        padding: 20px;
        font-size: 16px;
        line-height: 1.6;
        background:
          linear-gradient(var(--bg-canvas), var(--bg-canvas)) padding-box,
          linear-gradient(
              135deg,
              rgba(var(--border-muted-rgb), 0.3),
              rgba(var(--white-rgb), 0.6)
            )
            border-box;
        box-shadow: inset 0 2px 4px rgba(var(--border-muted-rgb), 0.05);
        resize: vertical;
        outline: none;
        color: var(--text-primary);
        margin-bottom: 24px;
        transition: all 0.3s ease;
      }
      .textarea-prompt:focus {
        background:
          linear-gradient(var(--bg-canvas), var(--bg-canvas)) padding-box,
          linear-gradient(135deg, var(--blue-light), var(--purple-light))
            border-box;
        box-shadow: 0 4px 12px rgba(var(--purple-rgb), 0.15);
      }

      .difficulty-row {
        display: flex;
        gap: 12px;
        margin-bottom: 32px;
      }
      .badge-difficulty {
        padding: 12px 36px;
        border-radius: 24px;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        border: none;
        background: rgba(var(--white-rgb), 0.6);
        color: var(--brown-medium);
        transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        box-shadow: 0 4px 12px rgba(var(--border-muted-rgb), 0.3);
      }
      .badge-difficulty:hover {
        transform: translateY(-2px);
        background: rgba(var(--white-rgb), 0.9);
        box-shadow: 0 8px 24px rgba(var(--border-muted-rgb), 0.4);
      }
      .badge-difficulty.active {
        background: linear-gradient(
          135deg,
          var(--yellow-light),
          var(--orange-light)
        );
        color: var(--brown-deep);
        box-shadow: 0 4px 12px rgba(var(--orange-rgb), 0.3);
      }

      .action-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .btn-primary {
        padding: 16px 32px;
        border-radius: 24px;
        border: none;
        background: linear-gradient(
          135deg,
          var(--yellow-light),
          var(--orange-light)
        );
        color: var(--brown-deep);
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 4px 12px rgba(var(--orange-rgb), 0.4);
        transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 180px;
        justify-content: center;
      }
      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(var(--orange-rgb), 0.5);
      }
      .btn-primary:active {
        transform: scale(0.98);
      }
      .btn-primary:disabled {
        opacity: 0.7;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }

      /* Video Player Result */
      .result-player {
        width: 100%;
        aspect-ratio: 16/9;
        background: linear-gradient(
          135deg,
          var(--yellow-lighter) 0%,
          var(--orange-mist) 50%,
          var(--orange-lighter) 100%
        );
        border-radius: 24px;
        overflow: hidden;
        box-shadow:
          0 8px 32px rgba(var(--border-muted-rgb), 0.2),
          0 0 0 1px rgba(var(--white-rgb), 0.4);
        margin-bottom: 48px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
      }
      .result-player.su {
        animation: slideUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .result-player::after {
        content: "";
        position: absolute;
        inset: 0;
        box-shadow: inset 0 0 40px rgba(var(--border-muted-rgb), 0.15);
        pointer-events: none;
      }
      .result-player video {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .sl {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        z-index: 1;
        position: relative;
      }
      .shal {
        position: absolute;
        width: 240px;
        height: 240px;
        border-radius: 9999px;
        background: radial-gradient(
          circle,
          rgba(var(--brown-gold-rgb), 0.25) 0%,
          rgba(var(--brown-gold-rgb), 0.08) 46%,
          rgba(var(--brown-gold-rgb), 0) 72%
        );
        filter: blur(14px);
        animation: hp 2s ease-in-out infinite;
      }
      @keyframes hp {
        0%,
        100% {
          opacity: 0.6;
          transform: scale(1);
        }
        50% {
          opacity: 1;
          transform: scale(1.1);
        }
      }
      .ssp {
        width: 56px;
        height: 56px;
        border-radius: 9999px;
        border: 4px solid rgba(var(--brown-gold-rgb), 0.2);
        border-top-color: var(--brown-gold);
        animation: spin 0.9s linear infinite;
        z-index: 1;
      }
      .slt {
        font-size: 18px;
        font-weight: 700;
        color: var(--brown-dark);
        z-index: 1;
      }
      .slm {
        font-size: 14px;
        color: var(--brown-medium);
        z-index: 1;
        max-width: 400px;
        text-align: center;
        line-height: 1.5;
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(40px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* === CustomSelect 下拉组件 — 暖橙/黄配色 === */
      .custom-select {
        position: relative;
        min-width: 160px;
      }
      .custom-select-trigger {
        display: flex;
        align-items: center;
        height: 48px;
        border-radius: 16px;
        border: 2px solid transparent;
        padding: 0 40px 0 20px;
        background:
          linear-gradient(var(--bg-canvas), var(--bg-canvas)) padding-box,
          linear-gradient(135deg, var(--yellow-light), var(--orange-light))
            border-box;
        font-size: 15px;
        font-weight: 600;
        color: var(--brown-dark);
        cursor: pointer;
        user-select: none;
        transition:
          border-color 200ms ease,
          box-shadow 200ms ease;
        box-shadow: 0 4px 12px rgba(var(--border-muted-rgb), 0.3);
      }
      .custom-select-trigger:hover {
        border-color: var(--yellow-light);
      }
      .custom-select-trigger.open {
        border-color: var(--yellow);
        box-shadow:
          0 4px 12px rgba(var(--border-muted-rgb), 0.3),
          0 0 0 3px rgba(var(--yellow-rgb), 0.18);
      }
      .custom-select-arrow {
        position: absolute;
        right: 14px;
        top: 50%;
        transform: translateY(-50%);
        width: 16px;
        height: 16px;
        pointer-events: none;
        transition: transform 250ms ease;
        color: var(--brown-medium);
      }
      .custom-select-trigger.open .custom-select-arrow {
        transform: translateY(-50%) rotate(180deg);
        color: var(--brown-gold);
      }
      @keyframes dropdownSlideIn {
        from {
          opacity: 0;
          transform: translateY(-8px) scaleY(0.96);
        }
        to {
          opacity: 1;
          transform: translateY(0) scaleY(1);
        }
      }
      .custom-select-menu {
        position: absolute;
        top: calc(100% + 8px);
        left: 0;
        right: 0;
        z-index: 100;
        border-radius: 16px;
        background: rgba(var(--white-rgb), 0.95);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        box-shadow:
          0 8px 32px rgba(var(--brown-medium-rgb), 0.12),
          0 2px 8px rgba(var(--brown-medium-rgb), 0.08);
        border: 1.5px solid var(--yellow-light);
        padding: 6px;
        animation: dropdownSlideIn 200ms cubic-bezier(0.16, 1, 0.3, 1);
        transform-origin: top center;
        max-height: 240px;
        overflow-y: auto;
      }
      .custom-select-menu::-webkit-scrollbar {
        width: 6px;
      }
      .custom-select-menu::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-select-menu::-webkit-scrollbar-thumb {
        background: var(--yellow);
        border-radius: 3px;
      }
      .custom-select-option {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 10px 14px;
        border-radius: 12px;
        border: none;
        background: transparent;
        color: var(--text-primary);
        font-family: inherit;
        font-size: 15px;
        font-weight: 500;
        cursor: pointer;
        transition: all 150ms ease;
        text-align: left;
      }
      .custom-select-option:hover {
        background: var(--yellow-mist);
      }
      .custom-select-option.active {
        background: var(--yellow-lighter);
        font-weight: 600;
      }
      .custom-select-option .check-icon {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
        color: var(--brown-gold);
        opacity: 0;
        transition: opacity 150ms ease;
      }
      .custom-select-option.active .check-icon {
        opacity: 1;
      }
      .custom-select-option .option-name {
        flex: 1;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      // Mock Data 假数据
      // 5色循环：蓝-紫-绿-黄-橙
      const COVER_COLORS = [
        "linear-gradient(135deg,var(--blue-lighter),var(--blue-mist))",
        "linear-gradient(135deg,var(--purple-lighter),var(--purple-mist))",
        "linear-gradient(135deg,var(--green-lighter),var(--green-mist))",
        "linear-gradient(135deg,var(--yellow-lighter),var(--yellow-mist))",
        "linear-gradient(135deg,var(--orange-lighter),var(--orange-mist))",
      ];

      const defaultHistory = [
        { id: 1, title: "Python 基础变量", colorIndex: 0 },
        { id: 2, title: "React 状态管理透视", colorIndex: 1 },
        { id: 3, title: "CSS Flexbox 终极图解", colorIndex: 2 },
      ];

      /* Safe Icon: renders lucide icon into a wrapper span without conflicting with React DOM */
      const Icon = ({ name, size = 20, className = "" }) => {
        const wrapRef = useRef(null);
        useEffect(() => {
          const el = wrapRef.current;
          if (!el || !window.lucide) return;
          el.innerHTML = "";
          const i = document.createElement("i");
          i.setAttribute("data-lucide", name);
          i.style.width = size + "px";
          i.style.height = size + "px";
          if (className) i.className = className;
          el.appendChild(i);
          window.lucide.createIcons({ nameAttr: "data-lucide", root: el });
        }, [name, size, className]);
        return (
          <span
            ref={wrapRef}
            style={{
              display: "inline-flex",
              alignItems: "center",
              justifyContent: "center",
              width: size,
              height: size,
            }}
          />
        );
      };

      /* CustomSelect 组件 — 参考 onboarding-modal，暖橙/黄配色 */
      const CustomSelect = ({ value, onChange, options, disabled }) => {
        const [isOpen, setIsOpen] = useState(false);
        const ref = useRef(null);

        useEffect(() => {
          const handleClickOutside = (e) => {
            if (ref.current && !ref.current.contains(e.target)) {
              setIsOpen(false);
            }
          };
          document.addEventListener("mousedown", handleClickOutside);
          return () =>
            document.removeEventListener("mousedown", handleClickOutside);
        }, []);

        const selectedOption = options.find((o) => o.value === value);

        return (
          <div className="custom-select" ref={ref}>
            <div
              className={`custom-select-trigger ${isOpen ? "open" : ""}`}
              onClick={() => !disabled && setIsOpen(!isOpen)}
              style={disabled ? { opacity: 0.6, cursor: "not-allowed" } : {}}
            >
              <span>{selectedOption ? selectedOption.label : "请选择"}</span>
              <svg
                className="custom-select-arrow"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                strokeWidth="2"
                strokeLinecap="round"
                strokeLinejoin="round"
              >
                <polyline points="6 9 12 15 18 9" />
              </svg>
            </div>
            {isOpen && !disabled && (
              <div className="custom-select-menu">
                {options.map((option) => (
                  <button
                    key={option.value}
                    type="button"
                    className={`custom-select-option ${value === option.value ? "active" : ""}`}
                    onClick={() => {
                      onChange(option.value);
                      setIsOpen(false);
                    }}
                  >
                    <svg
                      className="check-icon"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      strokeWidth="2.5"
                      strokeLinecap="round"
                      strokeLinejoin="round"
                    >
                      <polyline points="20 6 9 17 4 12" />
                    </svg>
                    <span className="option-name">{option.label}</span>
                  </button>
                ))}
              </div>
            )}
          </div>
        );
      };

      const DURATION_OPTIONS = [
        { value: "3", label: "3 分钟" },
        { value: "5", label: "5 分钟" },
        { value: "7", label: "7 分钟" },
        { value: "10", label: "10 分钟" },
        { value: "15", label: "15 分钟" },
        { value: "20", label: "20 分钟" },
        { value: "30", label: "30 分钟" },
      ];

      const GEN_MESSAGES = [
        "解析知识点语义结构…",
        "构建视频分镜脚本…",
        "生成动画资产…",
        "合成语音解说…",
        "渲染最终视频…",
        "优化输出质量…",
      ];

      const MOCK_SUGGESTIONS = [
        { id: 1, icon: "🎬", title: "递归与分治策略详解" },
        { id: 2, icon: "🎬", title: "JavaScript 闭包原理" },
        { id: 3, icon: "🎬", title: "数据结构：链表入门" },
        { id: 4, icon: "🎬", title: "Python 基础变量与类型" },
        { id: 5, icon: "🎬", title: "React 状态管理透视" },
        { id: 6, icon: "🎬", title: "CSS Flexbox 终极图解" },
      ];

      const K2VApp = () => {
        const [difficulty, setDifficulty] = useState("入门");
        const [duration, setDuration] = useState("5");
        const [prompt, setPrompt] = useState("");
        const [isGenerating, setIsGenerating] = useState(false);
        const [genMessage, setGenMessage] = useState(GEN_MESSAGES[0]);
        const [showResult, setShowResult] = useState(false);
        const [titleText, setTitleText] = useState("");
        const [history, setHistory] = useState(defaultHistory);
        const [nextCI, setNextCI] = useState(3);
        const [searchQuery, setSearchQuery] = useState("");
        const [showSuggestions, setShowSuggestions] = useState(false);
        const [suggestions, setSuggestions] = useState([]);

        useEffect(() => {
          if (!searchQuery.trim()) {
            setSuggestions([]);
            return;
          }
          const filtered = MOCK_SUGGESTIONS.filter((item) =>
            item.title.toLowerCase().includes(searchQuery.toLowerCase()),
          );
          setSuggestions(filtered);
        }, [searchQuery]);

        useEffect(() => {
          const fullTitle = "Knowledge 2 Video";
          let i = 0;
          const timer = setInterval(() => {
            setTitleText(fullTitle.slice(0, i + 1));
            i++;
            if (i >= fullTitle.length) {
              clearInterval(timer);
            }
          }, 100);
          return () => clearInterval(timer);
        }, []);

        const handleGenerate = () => {
          if (!prompt.trim()) return;
          setIsGenerating(true);
          setShowResult(false);
          setGenMessage(GEN_MESSAGES[0]);

          // 模拟分步消息切换
          let msgIdx = 0;
          const msgTimer = setInterval(() => {
            msgIdx++;
            if (msgIdx < GEN_MESSAGES.length) {
              setGenMessage(GEN_MESSAGES[msgIdx]);
            }
          }, 1200);

          // 模拟生成完成 (约 7 秒)
          setTimeout(() => {
            clearInterval(msgTimer);
            setIsGenerating(false);
            setShowResult(true);
            // 添加到历史记录
            setHistory((prev) => {
              const title =
                prompt.trim().split("\n")[0].slice(0, 30) || "知识点视频";
              const ci = nextCI;
              setNextCI(ci + 1);
              const newItem = { id: Date.now(), title, colorIndex: ci };
              return [newItem, ...prev].slice(0, 10);
            });
          }, 7000);
        };

        const handleReset = () => {
          setPrompt("");
          setShowResult(false);
        };

        return (
          <div className="immersive-layout">
            <div className="immersive-container">
              {/* 返回按钮 */}
              <div className="header-actions">
                <a href="dashboard-preview.html" className="btn-back">
                  <Icon name="arrow-left" size={16} />
                  返回主页面
                </a>
              </div>

              {/* 标题区 */}
              <header className="page-header">
                <h1 className="page-title">
                  <span>{titleText}</span>
                  <span className="typewriter-cursor">|</span>
                </h1>
                <p className="page-subtitle">你的专属 AIGC 视频知识库</p>
              </header>

              {/* 搜索栏 + 联想下拉 */}
              <div className="search-container">
                <div className="search-icon">
                  <Icon name="search" size={20} />
                </div>
                <input
                  type="text"
                  className="input-search"
                  placeholder="搜索已生成的知识点视频..."
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  onFocus={() => setShowSuggestions(true)}
                  onBlur={() =>
                    setTimeout(() => setShowSuggestions(false), 200)
                  }
                />
                <div
                  className={
                    "search-suggestions" +
                    (showSuggestions && suggestions.length > 0 ? " show" : "")
                  }
                >
                  {suggestions.map((item) => (
                    <div
                      key={item.id}
                      className="suggestion-item"
                      onMouseDown={() => setSearchQuery(item.title)}
                    >
                      <div className="suggestion-icon">{item.icon}</div>
                      <span>{item.title}</span>
                    </div>
                  ))}
                </div>
              </div>

              {/* 猜你需要 */}
              <h3 className="card-title" style={{ marginBottom: "20px" }}>
                猜你需要
              </h3>
              <div className="video-matrix">
                {[
                  { id: 101, title: "递归与分治策略详解" },
                  { id: 102, title: "JavaScript 闭包原理" },
                  { id: 103, title: "数据结构：链表入门" },
                ].map((video) => (
                  <div className="video-card" key={video.id}>
                    <div className="video-thumbnail">
                      <Icon name="play-circle" size={48} />
                    </div>
                    <h4 className="video-title">{video.title}</h4>
                  </div>
                ))}
              </div>

              {/* 控制台卡片 */}
              <section className="console-card">
                <h3 className="card-title">输入你需要讲解的知识点</h3>
                <textarea
                  className="textarea-prompt"
                  placeholder="例如：请用生动的比喻讲解什么是 Python 的闭包函数，并结合简单的代码案例。最好在讲解的时候附带动画效果辅助理解..."
                  value={prompt}
                  onChange={(e) => setPrompt(e.target.value)}
                  disabled={isGenerating}
                />

                <div className="difficulty-row">
                  {["入门", "中等", "专家"].map((level) => (
                    <button
                      key={level}
                      className={`badge-difficulty ${difficulty === level ? "active" : ""}`}
                      onClick={() => setDifficulty(level)}
                      disabled={isGenerating}
                    >
                      {level}
                    </button>
                  ))}
                </div>

                <div className="action-row">
                  <button
                    className="btn-regenerate"
                    onClick={handleReset}
                    disabled={isGenerating}
                  >
                    <Icon name="rotate-ccw" size={16} />
                    重新生成
                  </button>
                  <button
                    className="btn-primary"
                    onClick={handleGenerate}
                    disabled={isGenerating || !prompt.trim()}
                  >
                    {isGenerating ? (
                      <>
                        <Icon
                          name="loader"
                          size={18}
                          className="animate-spin"
                        />
                        正在生成…
                      </>
                    ) : (
                      <>
                        <Icon name="sparkles" size={18} /> 在线生成
                      </>
                    )}
                  </button>
                </div>
              </section>

              {/* 生成结果播放器 */}
              <div className={"result-player" + (showResult ? " su" : "")}>
                {showResult ? (
                  <video controls autoPlay muted loop>
                    <source
                      src="https://www.w3schools.com/html/mov_bbb.mp4"
                      type="video/mp4"
                    />
                    你的浏览器不支持该视频。
                  </video>
                ) : isGenerating ? (
                  <div className="sl">
                    <div className="shal" />
                    <div className="ssp" />
                    <p className="slt">正在生成知识点视频…</p>
                    <p className="slm">{genMessage}</p>
                  </div>
                ) : (
                  <div
                    style={{
                      display: "flex",
                      flexDirection: "column",
                      alignItems: "center",
                      gap: "16px",
                      color: "var(--brown-light)",
                      zIndex: 1,
                    }}
                  >
                    <Icon name="video" size={64} />
                    <span
                      style={{
                        fontSize: "16px",
                        fontWeight: 600,
                        letterSpacing: "0.5px",
                        color: "var(--brown-medium)",
                      }}
                    >
                      生成的视频将在此处播放
                    </span>
                  </div>
                )}
              </div>

              {/* 历史视频矩阵 */}
              <div>
                <h3 className="card-title" style={{ marginBottom: "20px" }}>
                  生成历史
                </h3>
                <div className="video-matrix">
                  {history.map((video) => (
                    <div className="video-card" key={video.id}>
                      <div
                        className="video-thumbnail"
                        style={
                          video.colorIndex != null
                            ? { background: COVER_COLORS[video.colorIndex % 5] }
                            : {}
                        }
                      >
                        <Icon name="play-circle" size={48} />
                      </div>
                      <h4 className="video-title">{video.title}</h4>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<K2VApp />);
    </script>

    <!-- 引入自转动画 -->
    <style>
      .animate-spin {
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </body>
</html>
