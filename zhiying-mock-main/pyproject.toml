[project]
name = "zhiying-mocks"
version = "0.1.0"
description = "Mock implementations of the seven zhiying-tutor microservices for local development."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aio-pika>=9.6.2",
    "httpx>=0.28.1",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "structlog>=25.5.0",
]

[project.scripts]
zhiying-mocks = "zhiying_mocks.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zhiying_mocks"]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src"]

[tool.ruff]
src = ["src"]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]
