[project]
name = "zhiying-core-generation"
version = "0.1.0"
description = "Real LLM-backed pretest, personalized plan, and quiz workers for zhiying-tutor."
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=9.6.2",
    "httpx>=0.28.1",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
]

[project.scripts]
zhiying-core-generation = "zhiying_core_generation.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zhiying_core_generation"]

[tool.pyright]
include = ["src", "tests"]

[tool.ruff]
src = ["src", "tests"]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
