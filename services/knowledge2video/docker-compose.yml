# ============================================================================
# Knowledge2Video Docker Compose 编排
#
# 启动: docker-compose up -d --build
# 停止: docker-compose down
# 日志: docker-compose logs -f
# ============================================================================

version: "3.8"

services:
  # ==========================================================================
  # Redis - 消息队列 & 结果存储
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: knowledge2video-ai-study-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==========================================================================
  # FastAPI - API 服务
  # ==========================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: knowledge2video-ai-study-api
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - API_KEYS=${API_KEYS:-dev-api-key-12345}
      - DEFAULT_API=${DEFAULT_API:-gpt-5}
      - DMX_BASE_URL=${DMX_BASE_URL}
      - DMX_API_KEY=${DMX_API_KEY}
      - LOGIC_MODEL=${LOGIC_MODEL:-gpt-5.6-terra}
      - CODE_MODEL=${CODE_MODEL:-gpt-5.6-sol}
      - TTS_PROVIDER=${TTS_PROVIDER:-vivo}
      - VIVO_TTS_APP_ID=${VIVO_TTS_APP_ID}
      - VIVO_TTS_APP_KEY=${VIVO_TTS_APP_KEY}
      - VIVO_TTS_BASE_URL=${VIVO_TTS_BASE_URL:-wss://api-ai.vivo.com.cn}
      - VIVO_TTS_ENGINE_ID=${VIVO_TTS_ENGINE_ID:-tts_humanoid_lam}
      - VIVO_TTS_VOICE=${VIVO_TTS_VOICE:-F245_natural}
      - VIVO_TTS_SPEED=${VIVO_TTS_SPEED:-50}
      - VIVO_TTS_VOLUME=${VIVO_TTS_VOLUME:-50}
      - DEBUG=${DEBUG:-false}
      - MAX_WORKERS=${MAX_WORKERS:-}
      - K2V_RENDER_WORKERS=${K2V_RENDER_WORKERS:-1}
      - MANIM_RENDER_TIMEOUT_SECONDS=${MANIM_RENDER_TIMEOUT_SECONDS:-21600}
      - VIDEO_TASK_TIME_LIMIT_SECONDS=${VIDEO_TASK_TIME_LIMIT_SECONDS:-43200}
      - VIDEO_TASK_SOFT_TIME_LIMIT_SECONDS=${VIDEO_TASK_SOFT_TIME_LIMIT_SECONDS:-41400}
      - OUTPUT_DIR=data/outputs
      - VIDEO_DIR=data/outputs/videos
      - METADATA_DIR=data/outputs/metadata
      - NO_PROXY=api.electricracker.net,api-ai.vivo.com.cn,vip.dmxapi.com,localhost,127.0.0.1,redis,api,worker
      - no_proxy=api.electricracker.net,api-ai.vivo.com.cn,vip.dmxapi.com,localhost,127.0.0.1,redis,api,worker
    volumes:
      # 开发模式：挂载源代码，修改后重启即可生效
      - ./src:/app/src
      - ./prompts:/app/prompts
      # 共享输出目录（API 和 Worker 都需要访问）
      - ./data/outputs:/app/data/outputs
      # LLM API 密钥配置文件（从宿主机挂载，可选）
      # - ./src/api_config.json:/app/src/api_config.json:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # ==========================================================================
  # Celery Worker - 视频生成后台任务
  # ==========================================================================
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: knowledge2video-ai-study-worker
    # 覆盖默认启动命令，启动 Celery Worker
    command: >
      python -m celery -A src.api.tasks.celery_app worker
      --loglevel=info
      --pool=solo
      -Q video_generation
      --concurrency=1
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DEFAULT_API=${DEFAULT_API:-gpt-5}
      - DMX_BASE_URL=${DMX_BASE_URL}
      - DMX_API_KEY=${DMX_API_KEY}
      - LOGIC_MODEL=${LOGIC_MODEL:-gpt-5.6-terra}
      - CODE_MODEL=${CODE_MODEL:-gpt-5.6-sol}
      - TTS_PROVIDER=${TTS_PROVIDER:-vivo}
      - VIVO_TTS_APP_ID=${VIVO_TTS_APP_ID}
      - VIVO_TTS_APP_KEY=${VIVO_TTS_APP_KEY}
      - VIVO_TTS_BASE_URL=${VIVO_TTS_BASE_URL:-wss://api-ai.vivo.com.cn}
      - VIVO_TTS_ENGINE_ID=${VIVO_TTS_ENGINE_ID:-tts_humanoid_lam}
      - VIVO_TTS_VOICE=${VIVO_TTS_VOICE:-F245_natural}
      - VIVO_TTS_SPEED=${VIVO_TTS_SPEED:-50}
      - VIVO_TTS_VOLUME=${VIVO_TTS_VOLUME:-50}
      - MAX_WORKERS=${MAX_WORKERS:-}
      - K2V_RENDER_WORKERS=${K2V_RENDER_WORKERS:-1}
      - MANIM_RENDER_TIMEOUT_SECONDS=${MANIM_RENDER_TIMEOUT_SECONDS:-21600}
      - VIDEO_TASK_TIME_LIMIT_SECONDS=${VIDEO_TASK_TIME_LIMIT_SECONDS:-43200}
      - VIDEO_TASK_SOFT_TIME_LIMIT_SECONDS=${VIDEO_TASK_SOFT_TIME_LIMIT_SECONDS:-41400}
      - OUTPUT_DIR=data/outputs
      - VIDEO_DIR=data/outputs/videos
      - METADATA_DIR=data/outputs/metadata
      - NO_PROXY=api.electricracker.net,api-ai.vivo.com.cn,vip.dmxapi.com,localhost,127.0.0.1,redis,api,worker
      - no_proxy=api.electricracker.net,api-ai.vivo.com.cn,vip.dmxapi.com,localhost,127.0.0.1,redis,api,worker
    volumes:
      # 开发模式：挂载源代码，修改后重启即可生效
      - ./src:/app/src
      - ./prompts:/app/prompts
      # 共享输出目录（与 API 服务共享）
      - ./data/outputs:/app/data/outputs
      # LLM API 密钥配置文件（从宿主机挂载，可选）
      # - ./src/api_config.json:/app/src/api_config.json:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

# ============================================================================
# 数据卷
# ============================================================================
volumes:
  redis_data:
    driver: local
