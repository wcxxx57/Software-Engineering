name: Publish application images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            image: ghcr.io/wcxxx57/software-engineering-backend
          - name: frontend
            context: ./frontend
            image: ghcr.io/wcxxx57/software-engineering-frontend
          - name: core-generation
            context: ./services/core-generation
            image: ghcr.io/wcxxx57/software-engineering-core-generation
          - name: education2d
            context: ./services/education2d
            image: ghcr.io/wcxxx57/software-engineering-education2d
          - name: knowledge2video
            context: ./services/knowledge2video
            image: ghcr.io/wcxxx57/software-engineering-knowledge2video
          - name: code2video
            context: ./services/code2video
            image: ghcr.io/wcxxx57/software-engineering-code2video

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
